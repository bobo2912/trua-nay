<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trưa Nay</title>
<meta name="description" content="Chọn quán ăn trưa, chia bill với bạn bè, gửi QR chuyển khoản qua Zalo.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trưa Nay">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<script src="config.js"></script>
<script>(function(){var t="pastel";try{t=JSON.parse(localStorage.getItem("tn2.theme"))||"pastel"}catch(e){}document.documentElement.setAttribute("data-theme",t);var c={pastel:"#F6F4FB",light:"#F7F7F8",dark:"#121214"}[t]||"#F6F4FB";document.write('<meta name="theme-color" content="'+c+'">')})();</script>
<style>
/* Pastel, compact: lavender-mist ground, mint as the action colour, peach for the one playful moment (spin) */
:root{
  --bg:#F6F4FB; --surface:#FFFFFF; --surface-2:#F0EEF7; --ink:#2F2C3B; --muted:#8C88A1; --line:#E8E5F1;
  --mint:#7FCBA8; --mint-ink:#173A2B; --mint-soft:#E2F4EB;
  --peach:#F4B49C; --peach-ink:#4A2418; --peach-soft:#FDEAE2;
  --sky-soft:#E5EEFB; --sky-ink:#2D4A75; --butter-soft:#FBF2D6; --butter-ink:#6B5414; --lilac-soft:#EEE8FB;
  --ok:#3C9A6E; --warn:#CC7A47; --danger:#CF5B5B;
  --shadow:0 1px 2px rgba(47,44,59,.05),0 6px 18px -10px rgba(47,44,59,.18);
  --f-head:"Nunito","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; color-scheme:light;
}
/* Sáng: neutral white */
:root[data-theme="light"]{
  --bg:#F7F7F8; --surface:#FFFFFF; --surface-2:#EFEFF2; --ink:#1C1C1E; --muted:#6E6E76; --line:#E4E4E9;
  --mint:#2E9E68; --mint-ink:#FFFFFF; --mint-soft:#E3F3EA; --peach:#EE8456; --peach-ink:#FFFFFF; --peach-soft:#FCEAE1;
  --sky-soft:#E6EEFA; --sky-ink:#2A4F86; --butter-soft:#FBF1D3; --butter-ink:#6B5414; --lilac-soft:#F0F0F4;
  --ok:#2E8A5C; --warn:#C8682F; --danger:#D23F3F; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px -10px rgba(0,0,0,.18); color-scheme:light}
/* Tối: neutral dark */
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1C1C20; --surface-2:#27272C; --ink:#F2F2F5; --muted:#9B9BA4; --line:#2F2F35;
  --mint:#4CC38A; --mint-ink:#0B1F14; --mint-soft:#17301F; --peach:#F2875C; --peach-ink:#26100A; --peach-soft:#3A2219;
  --sky-soft:#1C2A40; --sky-ink:#A9C4F5; --butter-soft:#3A3218; --butter-ink:#F0D78A; --lilac-soft:#232229;
  --ok:#6FD3A0; --warn:#F2A06F; --danger:#F08B8B; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding-inline:14px;padding-block:0 calc(76px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]{display:none!important}
.wrap{max-width:540px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:-.005em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.8rem}

/* header: solid, sticky, clears the status bar */
.top{position:sticky;top:0;z-index:15;background:var(--bg);margin-inline:-14px;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:1.45rem;font-weight:900}
.top small{display:block;color:var(--muted);font-size:.76rem;font-weight:500}
.top .act{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.mint{background:var(--mint);color:var(--mint-ink)}

/* basics */
.card{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.between{justify-content:space-between}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px}
.sec h2{font-size:.95rem;font-weight:800}
.sec small{color:var(--muted);font-size:.76rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:10px;border:0;background:var(--surface-2);padding:7px 12px;font-weight:600;font-size:.84rem;min-height:34px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.mint{background:var(--mint);color:var(--mint-ink)}
.btn.peach{background:var(--peach);color:var(--peach-ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:28px;padding:4px 9px;font-size:.78rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;min-height:36px;font-size:16px}
textarea.inp{resize:vertical;min-height:60px}
.inp:focus{border-color:var(--mint);outline:none;box-shadow:0 0 0 3px var(--mint-soft)}
.lbl{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin:0 0 4px 2px}
.field{display:flex;flex-direction:column}
.hint{font-size:.75rem;color:var(--muted);margin:4px 2px 0}
.err{color:var(--danger);font-size:.8rem;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:0;background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:500;min-height:28px;display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{background:var(--mint);color:var(--mint-ink)}
.chip .av{width:18px;height:18px;font-size:.55rem}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:5px 4px;font-size:.8rem;font-weight:600;color:var(--muted);min-height:30px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch input{width:40px;height:24px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;flex:none;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--mint)}
.switch input:checked::after{transform:translateX(16px)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:.7rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--mint-soft);color:var(--ok)}
.b-warn{background:var(--peach-soft);color:var(--warn)}
.b-soft{background:var(--surface-2);color:var(--muted)}
.b-sky{background:var(--sky-soft);color:var(--sky-ink)}
.b-butter{background:var(--butter-soft);color:var(--butter-ink)}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:.7rem;flex:none;overflow:hidden}
.empty{text-align:center;padding:22px 14px;color:var(--muted);font-size:.84rem}
.empty b{display:block;color:var(--ink);font-family:var(--f-head);font-size:1rem;margin-bottom:2px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none}
.li:last-child{border-bottom:0}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mid small{display:block;color:var(--muted);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.li .end b{font-family:var(--f-head);font-weight:800}
.chev{color:var(--muted);flex:none}
.pos{color:var(--ok)}.neg{color:var(--warn)}

/* eat */
.hello{background:var(--lilac-soft);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hello h2{font-size:1.2rem;font-weight:900}
.hello p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.ticket{background:var(--surface);border-radius:16px;padding:16px 14px 14px;text-align:center;box-shadow:var(--shadow);position:relative}
.reel{min-height:74px;display:grid;place-items:center;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:12px}
.reel b{font-family:var(--f-head);font-size:clamp(1.35rem,6vw,1.8rem);font-weight:900;line-height:1.15}
.reel b.idle{color:var(--muted);font-size:1.05rem;font-weight:800}
.reel b.won{color:var(--warn)}
.reel small{display:block;color:var(--muted);margin-top:4px;font-size:.76rem}
.spin{width:100%;border:0;border-radius:12px;background:var(--peach);color:var(--peach-ink);font-family:var(--f-head);font-weight:900;font-size:1.05rem;padding:10px;min-height:44px;box-shadow:0 4px 0 color-mix(in srgb,var(--peach) 70%,#000 12%);transition:transform .08s,box-shadow .08s}
.spin:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--peach) 70%,#000 12%)}
.spin[disabled]{opacity:.5}
.pick{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.pick b{font-family:var(--f-head);font-weight:800}
.pick p{margin:2px 0 8px;font-size:.8rem;color:var(--muted)}
.thinking{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;padding:8px 2px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--mint);animation:bob 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{opacity:.25}50%{opacity:1}}

/* bills */
.bill{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow)}
.bill .dt{width:38px;flex:none;text-align:center;line-height:1.05;border-radius:10px;background:var(--surface-2);padding:5px 0}
.bill .dt b{display:block;font-family:var(--f-head);font-size:1rem;font-weight:900}
.bill .dt small{font-size:.62rem;color:var(--muted);text-transform:uppercase}
.bill .mid{flex:1;min-width:0}
.bill .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill .mid small{display:block;color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.bill .end b{font-family:var(--f-head);font-weight:800}
.month{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px}
.share{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.share:last-child{border-bottom:0}
.share .mid{flex:1;min-width:0}
.share .mid b{display:block;font-weight:600;font-size:.9rem}
.share .mid small{color:var(--muted);font-size:.72rem}
.share .amt{font-family:var(--f-head);font-weight:800;text-align:right}
.share .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;width:100%;padding-left:38px;margin-top:4px}
.share-wrap{display:flex;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.share-wrap:last-child{border-bottom:0}
.share-wrap .share{border:0;padding:0;width:100%}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;margin-top:4px;border-top:2px solid var(--surface-2)}
.total b{font-family:var(--f-head);font-size:1.3rem;font-weight:900}
.preview{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.preview .r{display:flex;justify-content:space-between;font-size:.82rem;padding:2px 0;gap:8px}
.preview .r.t{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;font-weight:700}
.peritem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:6px;align-items:center;margin-bottom:6px}
.peritem .who{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600;font-size:.84rem}
.peritem .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peritem .val{font-size:.74rem;color:var(--muted);min-width:56px;text-align:right}
.fees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* debts */
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum2 > div{border-radius:12px;padding:10px 12px}
.sum2 .in{background:var(--mint-soft)}.sum2 .out{background:var(--peach-soft)}
.sum2 small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.sum2 b{font-family:var(--f-head);font-size:1.25rem;font-weight:900}
.pair{background:var(--surface);border-radius:var(--r);padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow)}
.pair .head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left}
.pair .who{flex:1;min-width:0}
.pair .who b{display:block;font-weight:600}
.pair .who small{color:var(--muted);font-size:.74rem}
.pair .amt{font-family:var(--f-head);font-size:1.05rem;font-weight:900;text-align:right}
.pair .sub{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.pair .sub .r{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.8rem;padding:3px 0}
.pair .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

/* poll */
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-radius:10px;background:var(--surface-2);padding:9px 10px;position:relative;overflow:hidden;margin-bottom:5px}
.opt .bar{position:absolute;inset:0 auto 0 0;background:var(--mint-soft);transition:width .3s}
.opt > *:not(.bar){position:relative}
.opt .mid{flex:1;min-width:0;font-weight:600}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--mint)}
.opt.win{box-shadow:inset 0 0 0 2px var(--peach)}

/* settings */
.set{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:0 12px}
.set .li{padding:11px 0}
.set .li .mid b{font-weight:500}
.ver{text-align:center;color:var(--muted);font-size:.74rem;margin:20px 0 6px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs nav{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;font-size:.66rem;font-weight:600;color:var(--muted);border-radius:10px;position:relative;min-height:46px}
.tabs button svg{width:21px;height:21px}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--mint-soft)}
.tabs .cnt{position:absolute;top:2px;right:calc(50% - 20px);background:var(--peach);color:var(--peach-ink);border-radius:999px;font-size:.58rem;min-width:15px;height:15px;padding:0 4px;display:grid;place-items:center;font-weight:700}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheet & toast */
.scrim{position:fixed;inset:0;background:rgba(30,28,40,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:0 14px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 10px;z-index:2}
.sheet-h h3{font-size:1.05rem;font-weight:900}
.x{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted)}
.qrimg{width:100%;max-width:300px;display:block;margin:0 auto;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(66px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:10px;font-size:.82rem;z-index:60;display:flex;gap:10px;align-items:center;max-width:calc(100% - 28px)}
.toast button{background:none;border:0;color:var(--peach);font-weight:700}
.onb{max-width:420px;margin:10vh auto 0;display:flex;flex-direction:column;gap:12px}
.onb h2{font-size:1.5rem;font-weight:900}
.keyrow{display:flex;gap:6px}.keyrow .inp{flex:1;min-width:0}
@media (max-width:360px){.grid2,.sum2{grid-template-columns:1fr}.fees{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<div class="tabs" hidden><nav id="tabbar" aria-label="Mục chính"></nav></div>

function newCode(n=20){const a="abcdefghijkmnpqrstuvwxyz23456789";const r=new Uint8Array(n);crypto.getRandomValues(r);return [...r].map(x=>a[x%a.length]).join("")}

const parseISO=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const daysAgo=s=>{if(!s)return Infinity;const t=new Date();t.setHours(0,0,0,0);return Math.round((t-parseISO(String(s).slice(0,10)))/864e5)};
const sinceDays=ts=>ts?Math.floor((Date.now()-new Date(ts).getTime())/864e5):Infinity;

const dLong=s=>{const n=daysAgo(s);if(n===0)return"Hôm nay";if(n===1)return"Hôm qua";const d=parseISO(s);return WD[d.getDay()]+" "+dLabel(s)};
const agoTxt=n=>n===Infinity?"chưa ăn":n===0?"hôm nay":n===1?"hôm qua":n+" ngày trước";

const unaccent=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D");

function money(expr){
  if(expr==null)return 0; if(typeof expr==="number")return expr;
  let t=String(expr).toLowerCase().replace(/đ|vnd|\s/g,""); if(!t)return 0;
  let total=0;
  for(const part of t.split("+")){
    if(!part)continue; const m=part.match(/^(\d+(?:[.,]\d+)?)k$/);
    if(m){total+=Math.round(parseFloat(m[1].replace(",","."))*1000);continue}
    const n=parseInt(part.replace(/[.,]/g,""),10); if(isNaN(n))continue;
    total+= n<1000? n*1000 : n;
  }
  return total;
}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}

/* ---------- VietQR ---------- */
const tlv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function qrNote(s){return unaccent(s).toUpperCase().replace(/[^A-Z0-9 ]/g,"").replace(/\s+/g," ").trim().slice(0,25)}
function vietqr(bin,acc,amount,note){
  const mai=tlv("00","A000000727")+tlv("01",tlv("00",bin)+tlv("01",acc))+tlv("02","QRIBFTTA");
  let p=tlv("00","01")+tlv("01",amount?"12":"11")+tlv("38",mai)+tlv("53","704");
  if(amount)p+=tlv("54",String(Math.round(amount)));
  p+=tlv("58","VN");if(note)p+=tlv("62",tlv("08",note));
  p+="6304";return p+crc16(p);
}
function drawQR(ctx,text,x,y,size,dark="#2F2C3B"){
  const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount();const cell=size/(n+8);
  ctx.fillStyle="#fff";ctx.fillRect(x,y,size,size);ctx.fillStyle=dark;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(Math.floor(x+(c+4)*cell),Math.floor(y+(r+4)*cell),Math.ceil(cell),Math.ceil(cell));
}

/* ---------- Firestore ---------- */
const FB=window.FIREBASE_CONFIG||null;
let fs=null;
const D=(...p)=>doc(fs,...p), C=(...p)=>collection(fs,...p);
function onWriteErr(e){
  const c=e&&e.code;
  if(c==="permission-denied"){toast("Firebase từ chối ghi. Kiểm tra lại Rules theo hướng dẫn mới.");return}
  if(c==="resource-exhausted"){toast("Đã hết hạn mức miễn phí hôm nay của Firebase, mai dùng lại được.");return}
  toast("Chưa lưu được, kiểm tra mạng rồi thử lại.");
}
const W=p=>p.catch(onWriteErr);
const saveCard=d=>W(setDoc(D("profiles",myPid()),{...d,updatedAt:new Date().toISOString()},{merge:true}));
const savePriv=d=>W(setDoc(D("profiles",myPid(),"private","settings"),d,{merge:true}));
const saveContact=(id,d)=>W(setDoc(D("profiles",myPid(),"contacts",id),d,{merge:true}));
const savePlace=(id,d)=>W(setDoc(D("profiles",myPid(),"places",id),d,{merge:true}));
const strip=o=>{const c={...o};delete c.id;delete c._ext;return c};
function membersOf(b){return [...new Set((b.people||[]).map(p=>p.pid).filter(Boolean).concat(b.ownerPid?[b.ownerPid]:[]))]}
function saveBill(b,prevMembers){
  const data=strip(b);data.members=membersOf(b);data.updatedAt=new Date().toISOString();
  const bt=writeBatch(fs);
  bt.set(D("bills",b.id),data);
  data.members.forEach(m=>bt.set(D("profiles",m,"bills",b.id),data));
  (prevMembers||[]).filter(m=>!data.members.includes(m)).forEach(m=>bt.delete(D("profiles",m,"bills",b.id)));
  const i=S.bills.findIndex(x=>x.id===b.id);if(data.members.includes(myPid())){const v={id:b.id,...data};i<0?S.bills.push(v):S.bills[i]=v}
  schedule();
  return bt.commit().then(()=>true).catch(e=>{onWriteErr(e);return false});
}
function deleteBill(b){
  const bt=writeBatch(fs);bt.delete(D("bills",b.id));membersOf(b).forEach(m=>bt.delete(D("profiles",m,"bills",b.id)));
  S.bills=S.bills.filter(x=>x.id!==b.id);schedule();
  return bt.commit().then(()=>true).catch(e=>{onWriteErr(e);return false});
}

const fbReady=()=>!!(FB&&FB.apiKey&&FB.projectId&&!/^DAN_/.test(FB.apiKey));
async function boot(){
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  renderLoading("Đang kết nối…");
  if(!fbReady()){renderLoading("Chưa điền cấu hình Firebase trong config.js.");return}
  let app;
  try{app=initializeApp(FB);
    try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()}),ignoreUndefinedProperties:true})}
    catch(e){fs=initializeFirestore(app,{ignoreUndefinedProperties:true})}
  }catch(e){renderLoading("Cấu hình Firebase trong config.js chưa đúng.");return}
  const auth=getAuth(app);let started=false;
  onAuthStateChanged(auth,async u=>{
    if(!u||started)return;started=true;S.uid=u.uid;
    if(!S.me){renderOnboard();return}
    try{await setDoc(D("keys",S.me.pid),{secret:S.me.secret,uids:arrayUnion(S.uid)},{merge:true})}
    catch(e){if(e&&e.code==="permission-denied"){renderOnboard("Mã khôi phục trên máy này không còn đúng. Nhập lại mã hoặc tạo hồ sơ mới.");return}}
    startApp();
  });
  signInAnonymously(auth).catch(e=>renderLoading(e&&e.code==="auth/operation-not-allowed"?"Chưa bật đăng nhập Anonymous trong Firebase Authentication.":"Không kết nối được Firebase ("+((e&&e.code)||"mạng")+")."));
}

function startApp(){
  S.subs.forEach(u=>u());S.subs=[];S.mode="db";
  const me=myPid();const since=n=>{const x=new Date();x.setDate(x.getDate()-n);return isoOf(x)};
  const live=(q,fn)=>S.subs.push(onSnapshot(q,fn,e=>{if(e&&e.code==="permission-denied"){S.err="Firebase từ chối đọc. Cập nhật Rules mới theo hướng dẫn.";schedule()}}));
  live(D("profiles",me),s=>{S.card=s.exists()?{...s.data()}:{};S.loaded.card=true;schedule()});
  live(D("profiles",me,"private","settings"),s=>{S.priv=s.exists()?{...s.data()}:{};schedule()});
  live(C("profiles",me,"contacts"),s=>{S.contacts=s.docs.map(x=>({id:x.id,...x.data()}));S.loaded.contacts=true;loadCards();schedule()});
  live(C("profiles",me,"places"),s=>{S.places=s.docs.map(x=>({id:x.id,...x.data()}));schedule()});
  live(query(C("profiles",me,"bills"),where("date",">=",since(400))),s=>{S.bills=s.docs.map(x=>({id:x.id,...x.data()}));S.loaded.bills=true;syncLinks();schedule()});
  $(".tabs").hidden=false;render();handleHash();
}
async function loadCards(){
  for(const c of S.contacts){if(c.pid&&!(c.pid in S.cards)){S.cards[c.pid]=null;try{const s=await getDoc(D("profiles",c.pid));S.cards[c.pid]=s.exists()?s.data():{}}catch(e){S.cards[c.pid]={}}schedule()}}
}
const linked=new Set();
function syncLinks(){ // when someone claims their line in my bill, link my contact to their profile
  for(const b of S.bills){if(b.ownerPid!==myPid())continue;
    for(const p of b.people||[]){if(p.cid&&p.pid&&!isMe(p)){const c=contactById(p.cid);const k=p.cid+">"+p.pid;if(c&&!c.pid&&!linked.has(k)&&!contactByPid(p.pid)){linked.add(k);saveContact(c.id,{pid:p.pid})}}}}
}

function doSpin(){

  const le=lastEaten();const w=pool.map(p=>src==="places"&&daysAgo(placeLast(p,le))>=14?2:1);
  let r=Math.random()*sum(w),win=pool[pool.length-1];for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){win=pool[i];break}}

  if(matchMedia("(prefers-reduced-motion: reduce)").matches||pool.length<2){finish();return}
  ui.spinning=true;btn.disabled=true;el.className="";meta.textContent="…";
  let step=0;const steps=20;

    let n;do{n=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&n.name===el.textContent);
    el.textContent=step===steps-1?win.name:n.name;step++;setTimeout(tick,40+Math.pow(step/steps,2.4)*300)};tick();
}

function myView(b){ // how a bill looks from my side
  const payer=P(b,b.payer);const iPay=isMe(payer);
  const others=(b.shares||[]).filter(s=>s.key!==b.payer);
  const due=sum(others.filter(s=>!s.paid).map(s=>s.amount));
  const mineS=(b.shares||[]).find(s=>isMe(P(b,s.key)));
  return {payer,iPay,others,due,mine:mineS,paidN:others.filter(s=>s.paid).length};
}
function viewBills(){

/* --- split maths --- */
function calc(ed){
  const parts=ed.sel.slice();const res={total:0,rows:[],err:""};
  if(!parts.length){res.err="Chọn người ăn.";return res}
  const raw={},sub={};let total=0;
  if(ed.mode==="equal"){total=money(ed.total);parts.forEach(p=>raw[p]=total/parts.length)}
  else if(ed.mode==="items"){let s=0;parts.forEach(p=>{sub[p]=money(ed.items[p]);s+=sub[p]});const adj=money(ed.ship)+money(ed.svc)-money(ed.disc);total=s+adj;parts.forEach(p=>raw[p]=s?sub[p]+adj*sub[p]/s:0);res.subtotal=s;res.adj=adj}
  else{parts.forEach(p=>{raw[p]=money(ed.items[p]);total+=raw[p]})}
  const payerIn=parts.includes(ed.payer);const others=parts.filter(p=>!(payerIn&&p===ed.payer));const amt={};
  const rnd=ed.round&&ed.mode!=="custom";
  others.forEach(p=>amt[p]=rnd?Math.ceil(raw[p]/1000-1e-9)*1000:Math.round(raw[p]));
  if(payerIn)amt[ed.payer]=Math.round(total)-sum(others.map(p=>amt[p]));
  else if(!rnd&&others.length){const d=Math.round(total)-sum(others.map(p=>amt[p]));if(d){const big=others.reduce((a,b)=>amt[b]>amt[a]?b:a);amt[big]+=d}}
  res.total=Math.round(total);res.rows=parts.map(p=>({key:p,amount:amt[p],sub:sub[p]}));
  if(res.total<=0)res.err=ed.mode==="equal"?"Nhập tổng tiền.":"Nhập tiền cho ít nhất một người.";
  return res;
}
function freq(){const f={};for(const b of S.bills)for(const p of b.people||[]){const k=p.pid?"p_"+p.pid:p.cid?"c_"+p.cid:"";if(k)f[k]=(f[k]||0)+1}return f}
function candidates(b,extra=[]){
  const m=new Map();const add=o=>{if(!m.has(o.key))m.set(o.key,o)};
  add({key:"p_"+myPid(),name:myName(),pid:myPid(),cid:null,phone:S.card.phone||null});
  if(b)(b.people||[]).forEach(p=>add({...p}));
  extra.forEach(add);
  const f=freq();
  contacts().slice().sort((a,b2)=>(f[b2.pid?"p_"+b2.pid:"c_"+b2.id]||0)-(f[a.pid?"p_"+a.pid:"c_"+a.id]||0)).forEach(c=>add(c.pid?{key:"p_"+c.pid,name:c.name,pid:c.pid,cid:c.id,phone:c.phone||null}:{key:"c_"+c.id,name:c.name,pid:null,cid:c.id,phone:c.phone||null}));
  return m;
}
function bankFor(p){
  if(!p)return null;if(isMe(p))return S.card.bank||null;
  const c=p.pid?contactByPid(p.pid):p.cid?contactById(p.cid):null;
  if(p.pid&&S.cards[p.pid]&&S.cards[p.pid].bank)return S.cards[p.pid].bank;
  return (c&&c.bank)||null;
}

async function fontsReady(){try{await document.fonts.load("700 40px 'Be Vietnam Pro'");await document.fonts.ready}catch(e){}}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrapText(ctx,t,max){const words=String(t).split(" ");const lines=[];let cur="";for(const w of words){const tt=cur?cur+" "+w:w;if(ctx.measureText(tt).width>max&&cur){lines.push(cur);cur=w}else cur=tt}if(cur)lines.push(cur);return lines}
async function qrCard({fromName,bank,amount,note,title}){
  await fontsReady();
  const W=900,H=1200,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");const F="'Be Vietnam Pro',system-ui,sans-serif";
  x.fillStyle="#EEE8FB";x.fillRect(0,0,W,H);
  x.fillStyle="#2F2C3B";x.font="800 38px "+F;x.fillText("Trưa Nay",60,80);
  x.font="500 28px "+F;x.fillStyle="#6E6A85";wrapText(x,title,W-120).slice(0,2).forEach((l,i)=>x.fillText(l,60,128+i*36));
  x.fillStyle="#fff";roundRect(x,60,200,W-120,940,36);x.fill();
  x.textAlign="center";x.fillStyle="#8C88A1";x.font="600 28px "+F;x.fillText((fromName||"")+" chuyển khoản",W/2,270);
  x.fillStyle="#C9653E";x.font="800 72px "+F;x.fillText(fmt(amount),W/2,352);
  drawQR(x,vietqr(bank.bin,bank.acc,amount,note),W/2-280,385,560);
  x.fillStyle="#2F2C3B";x.font="700 32px "+F;x.fillText(bank.holder||"",W/2,1000);
  x.fillStyle="#6E6A85";x.font="500 27px "+F;x.fillText(bankName(bank.bin)+" · "+bank.acc,W/2,1044);
  x.font="600 25px "+F;x.fillText("Nội dung: "+note,W/2,1090);
  x.font="500 21px "+F;x.fillStyle="#8C88A1";x.fillText("Quét bằng app ngân hàng bất kỳ · VietQR",W/2,1178);

  x.fillStyle="#8C88A1";x.font="500 21px "+F;x.textAlign="center";x.fillText("Mỗi người quét đúng mã có tên mình · VietQR",W/2,H-30);

function qrActions(el,{canvas,filename,msg,phone,onSent}){
  const url=canvas.toDataURL("image/png");let file=null;canvas.toBlob(b=>{if(b)file=new File([b],filename,{type:"image/png"})},"image/png");
  const canShare=!!(navigator.share&&navigator.canShare);
  el.innerHTML=`<img class="qrimg" alt="Mã QR chuyển khoản" src="${url}">
    <div class="stack" style="margin-top:10px">
      ${canShare?`<button class="btn mint block" id="qShare">${ic("send")} Gửi ảnh QR (chọn Zalo)</button>`:""}
      <div class="grid2"><a class="btn ${canShare?"":"mint"}" id="qSave" href="${url}" download="${esc(filename)}">${ic("save")} Lưu ảnh</a><button class="btn" id="qCopy">${ic("copy")} Chép lời nhắn</button></div>
      ${phone?`<a class="btn block" target="_blank" rel="noopener" href="https://zalo.me/${esc(phone)}">Mở chat Zalo</a>`:""}

    try{await navigator.share(data);onSent&&onSent()}catch(e){if(e&&e.name!=="AbortError")toast("Không mở được bảng chia sẻ, dùng Lưu ảnh.")}};
  $("#qSave",el).addEventListener("click",()=>onSent&&onSent());
  $("#qCopy",el).onclick=async()=>{if(await copyText(msg,"Đã chép lời nhắn"))onSent&&onSent();else{const t=$("#qMsg",el);t.focus();t.select()}};
}

function debtGroups(){
  const m=new Map();
  for(const b of S.bills){const payer=P(b,b.payer);if(!payer)continue;
    for(const s of b.shares||[]){if(s.paid||s.key===b.payer||!(s.amount>0))continue;const p=P(b,s.key);if(!p)continue;
      let dir,person;
      if(isMe(payer)&&!isMe(p)){dir="in";person=p}else if(isMe(p)&&!isMe(payer)){dir="out";person=payer}else continue;
      const id=idOf(person,b);const k=dir+"|"+id;
      if(!m.has(k))m.set(k,{key:k,dir,id,person,bill0:b,items:[]});m.get(k).items.push({bill:b,share:s});
    }}
  return [...m.values()].map(g=>{g.items.sort((a,b)=>a.bill.date.localeCompare(b.bill.date));g.total=sum(g.items.map(i=>i.share.amount));g.oldest=g.items[0].bill.date;
    const last=g.items[g.items.length-1].bill;g.name=dn(g.person,last);g.bank=g.dir==="in"?(S.card.bank||null):(last.payerBank||null);
    const rs=g.items.map(i=>i.share.remindedAt).filter(Boolean).sort();g.lastRemind=rs[rs.length-1]||null;g.sent=g.items.every(i=>i.share.sentAt);return g}).sort((a,b)=>b.total-a.total);
}
function needRemind(g){const c=cfg();return g.dir==="in"&&daysAgo(g.oldest)>=c.remindAfter&&(!g.lastRemind||sinceDays(g.lastRemind)>=c.remindEvery)}
function recordRemind(g){
  const now=new Date().toISOString();const byBill={};g.items.forEach(i=>(byBill[i.bill.id]=byBill[i.bill.id]||[]).push(i.share.key));
  for(const [bid,keys] of Object.entries(byBill)){const b=S.bills.find(x=>x.id===bid);if(!b)continue;
    saveBill({...b,shares:b.shares.map(s=>keys.includes(s.key)&&!s.paid?{...s,remindedAt:now,remindCount:(s.remindCount||0)+1}:s)},b.members)}
}
function setPaid(items,val){
  const byBill={};items.forEach(i=>(byBill[i.bill.id]=byBill[i.bill.id]||[]).push(i.share.key));const undo=[];const now=new Date().toISOString();
  for(const [bid,keys] of Object.entries(byBill)){const b=S.bills.find(x=>x.id===bid);if(!b)continue;undo.push(b);
    saveBill({...b,shares:b.shares.map(s=>keys.includes(s.key)?{...s,paid:val,paidAt:val?now:null}:s)},b.members)}
  return ()=>undo.forEach(b=>saveBill(b,b.members));
}
function setSent(items){
  const byBill={};items.forEach(i=>(byBill[i.bill.id]=byBill[i.bill.id]||[]).push(i.share.key));const now=new Date().toISOString();
  for(const [bid,keys] of Object.entries(byBill)){const b=S.bills.find(x=>x.id===bid);if(!b)continue;saveBill({...b,shares:b.shares.map(s=>keys.includes(s.key)?{...s,sentAt:now}:s)},b.members)}
}
function viewDebts(){
  const gs=debtGroups();const inT=sum(gs.filter(g=>g.dir==="in").map(g=>g.total)),outT=sum(gs.filter(g=>g.dir==="out").map(g=>g.total));
  let h=`<div class="sum2"><div class="in"><small>Người khác nợ tôi</small><b class="num">${fmt(inT)}</b></div><div class="out"><small>Tôi nợ</small><b class="num">${fmt(outT)}</b></div></div>`;
  if(!gs.length)return h+`<div class="empty" style="margin-top:12px"><b>Không ai nợ ai</b>Phần chưa trả trong các bill sẽ hiện ở đây.</div>`;
  for(const dir of ["in","out"]){
    const list=gs.filter(g=>g.dir===dir);if(!list.length)continue;
    h+=`<div class="sec"><h2>${dir==="in"?"Nợ tôi":"Tôi nợ"}</h2><small>${list.length} người</small></div>`;
    for(const g of list){const open=ui.openPairs.has(g.key);const due=needRemind(g);
      h+=`<article class="pair"><button class="head" data-toggle="${esc(g.key)}">${avatar(g.name)}<span class="who"><b>${esc(g.name)}</b><small>${g.items.length} bữa · từ ${esc(dLong(g.oldest).toLowerCase())}${dir==="in"&&g.lastRemind?" · nhắc "+esc(agoTxt(sinceDays(g.lastRemind))):""}${dir==="out"&&g.sent?" · đã báo chuyển":""}</small></span>
        <span><span class="amt num ${dir==="in"?"pos":"neg"}">${fmt(g.total)}</span>${due?`<br><span class="badge b-warn">Cần nhắc</span>`:dir==="in"&&g.sent?`<br><span class="badge b-sky">Báo đã chuyển</span>`:""}</span></button>
        ${open?`<div class="sub">${g.items.map(i=>`<div class="r"><button class="btn sm ghost" data-openbill="${i.bill.id}" style="padding:0;min-height:0">${esc(dLabel(i.bill.date))} · ${esc(i.bill.placeName||i.bill.title)}</button><b class="num">${fmt(i.share.amount)}</b></div>`).join("")}</div>`:""}
        <div class="acts">${dir==="in"
          ?`${g.bank?`<button class="btn sm ${due?"peach":""}" data-remind="${esc(g.key)}">${ic("send")} Nhắc kèm QR</button>`:`<button class="btn sm" data-goto="settings">Thêm TK nhận tiền</button>`}<button class="btn sm mint" data-allpaid="${esc(g.key)}">${ic("check")} Đã nhận đủ</button>`

function viewContacts(){

  let h=`<input class="inp" id="cQ" placeholder="Tìm tên, số Zalo" value="${esc(ui.cq)}" autocomplete="off">`;
  if(!S.contacts.filter(c=>!c.hidden).length)return h+`<div class="empty" style="margin-top:12px"><b>Danh bạ trống</b>Thêm người hay ăn cùng bằng nút +, hoặc gửi link của bạn (nút liên kết) để họ thêm bạn.</div>`;
  h+=`<div class="card" style="margin-top:8px;padding-block:0"><div class="list">${cs.map(c=>{const bal=balanceWith(c);const n=f[c.pid?"p_"+c.pid:"c_"+c.id]||0;

function bankFields(p,bk){return `<select class="inp" id="${p}Bank" aria-label="Ngân hàng"><option value="">Ngân hàng</option>${BANKS.map(([b,n])=>`<option value="${b}" ${bk.bin===b?"selected":""}>${esc(n)}</option>`).join("")}</select>

function addFromLink(pid,name){
  if(pid===myPid()){toast("Đây là link của chính bạn.");return}
  const ex=contactByPid(pid);if(ex){toast(ex.name+" đã có trong danh bạ");openContact(ex.id);return}
  const same=contacts().find(c=>!c.pid&&norm(c.name)===norm(name));
  const el=openSheet("Thêm vào danh bạ",`<div class="stack"><div class="row">${avatar(name)}<b>${esc(name)}</b></div>
    ${same?`<button class="btn mint block" id="alMerge">Gộp vào "${esc(same.name)}" đã có</button><button class="btn block" id="alNew">Thêm người mới</button>`:`<button class="btn mint block" id="alNew">Thêm vào danh bạ</button>`}</div>`);
  const m=$("#alMerge",el);if(m)m.onclick=()=>{saveContact(same.id,{pid});closeSheet();toast("Đã liên kết "+same.name)};
  $("#alNew",el).onclick=()=>{saveContact(rid(),{name,phone:"",bank:null,pid,hidden:false,createdAt:new Date().toISOString()});closeSheet();toast("Đã thêm "+name)};
}

    <input class="inp" id="peAddr" value="${esc(ed.address)}" maxlength="120" placeholder="Địa chỉ (không bắt buộc)" aria-label="Địa chỉ">
    <input class="inp" id="peNote" value="${esc(ed.note)}" maxlength="120" placeholder="Ghi chú: món ngon, giờ đông…" aria-label="Ghi chú">
    <p class="err" id="peErr" hidden></p><button class="btn mint block" id="peSave">${p?"Lưu":"Thêm quán"}</button>
    ${p?`<button class="btn danger" id="peDel">${ui.confirm==="pe"+id?"Bấm lần nữa":"Xóa quán"}</button>`:""}</div>`);
  $$("#peTags [data-v]",el).forEach(c=>c.onclick=()=>{const v=c.dataset.v;ed.tags=ed.tags.includes(v)?ed.tags.filter(x=>x!==v):[...ed.tags,v];c.setAttribute("aria-pressed",ed.tags.includes(v))});
  const seg=(sel,key,num)=>$$(sel+" [data-v]",el).forEach(c=>c.onclick=()=>{ed[key]=num?+c.dataset.v:c.dataset.v;$$(sel+" [data-v]",el).forEach(x=>x.setAttribute("aria-pressed",x===c))});
  seg("#pePrice","price",true);seg("#peDist","dist",false);
  $("#peSave",el).onclick=()=>{const name=$("#peName",el).value.trim();if(!name){const e=$("#peErr",el);e.textContent="Nhập tên quán.";e.hidden=false;return}
    savePlace(id||rid(),{name,tags:ed.tags,price:ed.price,dist:ed.dist,address:$("#peAddr",el).value.trim(),note:$("#peNote",el).value.trim(),archived:false,createdAt:p?p.createdAt:new Date().toISOString()});
    closeSheet();toast(p?"Đã lưu":"Đã thêm "+name)};
  const dl=$("#peDel",el);if(dl)dl.onclick=()=>{if(ui.confirm!=="pe"+id){ui.confirm="pe"+id;dl.textContent="Bấm lần nữa";return}ui.confirm=null;savePlace(id,{archived:true});closeSheet();toast("Đã xóa "+p.name,()=>savePlace(id,{archived:false}))};
}

/* ---------- links: #b= bill, #p= person, #v= poll ---------- */
let pendingHash=location.hash;
function handleHash(){
  const h=pendingHash||"";pendingHash="";if(!h)return;
  history.replaceState(null,"",location.pathname);
  let m;
  if((m=h.match(/#b=([a-z0-9]{16,40})/i)))openBillDetail(m[1]);
  else if((m=h.match(/#p=([a-z0-9]{16,40})(?:~(.*))?/i)))addFromLink(m[1],decodeURIComponent(m[2]||"Bạn mới"));
  else if((m=h.match(/#v=([a-z0-9]{16,40})/i))){ui.tab="eat";ui.eatView="vote";render();openPoll(m[1])}
}
window.addEventListener("hashchange",()=>{if(S.mode==="db"&&location.hash){pendingHash=location.hash;handleHash()}});

/* no pinch / double-tap zoom (iOS Safari ignores user-scalable) */
["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});

boot();

</script>
