<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trưa Nay</title>
<meta name="description" content="Chọn quán ăn trưa và chia bill cho cả nhóm, gửi QR chuyển khoản qua Zalo.">
<meta name="theme-color" content="#2E6A39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trưa Nay">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, a "lunch ticket" card system, bottom tab bar; spin reel is the one loud element */
:root{
  --bg:#F1F4EC; --surface:#FFFFFF; --surface-2:#E6EBDF; --ink:#1A2217; --muted:#5B6754; --line:#D3DBC8;
  --leaf:#2E6A39; --leaf-ink:#FFFFFF; --leaf-soft:#DCEBD9;
  --chili:#CF4427; --chili-ink:#FFFFFF; --rice:#F6E6AE;
  --ok:#2B7A4B; --ok-soft:#DCEFE2; --warn:#A9501A; --warn-soft:#F8E4D2; --danger:#B3261E;
  --shadow:0 1px 2px rgba(26,34,23,.06),0 8px 24px -12px rgba(26,34,23,.18);
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10150E; --surface:#182016; --surface-2:#212A1E; --ink:#E7ECE1; --muted:#9BA691; --line:#2D3829;
  --leaf:#82C78E; --leaf-ink:#0D140B; --leaf-soft:#1F3220; --chili:#F07B5E; --chili-ink:#1A0D08; --rice:#3A3420;
  --ok:#72C493; --ok-soft:#1C3325; --warn:#EB9C5F; --warn-soft:#3A2617; --danger:#F2867C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10150E; --surface:#182016; --surface-2:#212A1E; --ink:#E7ECE1; --muted:#9BA691; --line:#2D3829;
  --leaf:#82C78E; --leaf-ink:#0D140B; --leaf-soft:#1F3220; --chili:#F07B5E; --chili-ink:#1A0D08; --rice:#3A3420;
  --ok:#72C493; --ok-soft:#1C3325; --warn:#EB9C5F; --warn-soft:#3A2617; --danger:#F2867C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:1.65rem;font-weight:800;line-height:1.05}
.brand h1 i{font-style:normal;color:var(--chili)}
.brand small{color:var(--muted);font-weight:500}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:.84rem;font-weight:600;max-width:52%}
.me img{width:28px;height:28px;border-radius:50%;flex:none}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;font-size:.86rem;color:var(--muted);margin-block:4px 10px;background:var(--surface)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-block:22px 10px}
.sec h2{font-size:1.15rem;font-weight:700}
.sec small{color:var(--muted);font-size:.82rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600;font-size:.92rem;min-height:42px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.btn.hot{background:var(--chili);border-color:var(--chili);color:var(--chili-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:.84rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
textarea.inp{resize:vertical;min-height:72px}
.inp:focus{border-color:var(--leaf);outline:none;box-shadow:0 0 0 3px var(--leaf-soft)}
label.lbl,.lbl{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.field{display:flex;flex-direction:column}
.hint{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:500;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.chip .av{width:20px;height:20px;font-size:.62rem}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:.85rem;font-weight:600;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch input{width:44px;height:26px;appearance:none;background:var(--line);border-radius:999px;position:relative;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked{background:var(--leaf)}
.switch input:checked::after{transform:translateX(18px)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.soft{background:var(--surface-2);color:var(--muted)}
.badge.rice{background:var(--rice);color:var(--ink)}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:.78rem;flex:none;color:#fff;overflow:hidden}
.av img{width:100%;height:100%}
.empty{text-align:center;padding:26px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:.9rem}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.li:last-child{border-bottom:0}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mid small{display:block;color:var(--muted);font-size:.8rem}
.li .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.err{color:var(--danger);font-size:.86rem}

/* today strip */
.today{display:grid;gap:12px;background:var(--leaf);color:var(--leaf-ink);border-radius:20px;padding:18px;position:relative;overflow:hidden}
.today::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:18px solid color-mix(in srgb,var(--leaf-ink) 10%,transparent)}
.today h2{font-size:1.5rem;font-weight:800;line-height:1.1}
.today p{margin:0;opacity:.88;font-size:.9rem}
.today .btn{background:var(--leaf-ink);color:var(--leaf);border-color:transparent}
.today .acts{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}

/* reel / ticket */
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px 18px;text-align:center;box-shadow:var(--shadow)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line);transform:translateY(-50%)}
.ticket::before{left:-10px}.ticket::after{right:-10px}
.reel{min-height:96px;display:grid;place-items:center;border-bottom:2px dashed var(--line);padding-bottom:14px;margin-bottom:14px}
.reel b{font-family:var(--f-display);font-size:clamp(1.6rem,7vw,2.3rem);font-weight:800;line-height:1.1;text-wrap:balance}
.reel b.idle{color:var(--muted);font-weight:700;font-size:1.3rem}
.reel b.won{color:var(--chili)}
.reel small{display:block;color:var(--muted);margin-top:6px;font-size:.84rem}
.spin{width:100%;border:0;border-radius:16px;background:var(--chili);color:var(--chili-ink);font-family:var(--f-display);font-weight:800;font-size:1.25rem;padding:14px;min-height:56px;box-shadow:0 6px 0 color-mix(in srgb,var(--chili) 60%,#000);transition:transform .08s,box-shadow .08s}
.spin:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--chili) 60%,#000)}
.spin[disabled]{opacity:.6}
.filters{display:flex;flex-direction:column;gap:10px;margin-top:14px}

/* bills */
.bill{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.bill .ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none;font-weight:800;font-family:var(--f-display);font-size:.78rem;color:var(--muted)}
.bill .mid{flex:1;min-width:0}
.bill .mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill .mid small{color:var(--muted);font-size:.8rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.pips i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--ok)}
.bill .end{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.bill .end b{font-family:var(--f-display);font-size:1.05rem}
.month{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}

/* receipt detail */
.receipt{background:var(--surface);border-radius:14px;border:1px solid var(--line);padding:16px;position:relative}
.receipt .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);padding-top:12px;margin-top:6px}
.receipt .tot b{font-family:var(--f-display);font-size:1.5rem}
.share{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dotted var(--line)}
.share:last-of-type{border-bottom:0}
.share .mid{flex:1;min-width:0}
.share .mid b{display:block;font-weight:600}
.share .mid small{color:var(--muted);font-size:.78rem}
.share .amt{font-weight:700;text-align:right}

/* debts */
.pair{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.pair.due{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.pair .head{display:flex;align-items:center;gap:10px}
.pair .arrow{color:var(--muted);font-size:.8rem}
.pair .who{flex:1;min-width:0}
.pair .who b{display:block}
.pair .who small{color:var(--muted);font-size:.78rem}
.pair .amt{font-family:var(--f-display);font-size:1.2rem;font-weight:800}
.pair .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pair .acts .btn{flex:1 1 auto}
.sub{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.sub .r{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.86rem;padding:5px 0}
.sumbar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sumbar > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sumbar b{display:block;font-family:var(--f-display);font-size:1.35rem}

/* poll */
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;position:relative;overflow:hidden;margin-bottom:8px}
.opt .bar{position:absolute;inset:0 auto 0 0;background:var(--leaf-soft);z-index:0;transition:width .3s}
.opt > *:not(.bar){position:relative;z-index:1}
.opt .mid{flex:1;min-width:0}
.opt .mid b{display:block}
.opt .mid small{color:var(--muted);font-size:.78rem}
.opt[aria-pressed="true"]{border-color:var(--leaf);box-shadow:0 0 0 2px var(--leaf-soft)}
.opt.win{border-color:var(--chili)}
.voters{display:flex}
.voters .av{width:22px;height:22px;font-size:.6rem;margin-left:-6px;border:2px solid var(--surface)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .dot{border-color:var(--leaf);background:var(--leaf)}
.opt[aria-pressed="true"] .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--leaf-ink)}

/* AI */
.ai-out{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pick{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.pick b{font-family:var(--f-display);font-size:1.05rem}
.pick p{margin:4px 0 8px;font-size:.88rem;color:var(--muted)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;padding:10px 0}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--leaf);animation:bob 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.stat{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .k{font-family:var(--f-display);font-weight:800;font-size:1.25rem;min-width:44px;color:var(--leaf)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72rem;font-weight:600;color:var(--muted);border-radius:12px;position:relative;min-height:52px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--leaf);background:var(--leaf-soft)}
.tabs .cnt{position:absolute;top:2px;right:calc(50% - 22px);background:var(--chili);color:var(--chili-ink);border-radius:999px;font-size:.62rem;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,9,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 12px;z-index:2}
.sheet-h h3{font-size:1.2rem;font-weight:800}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:50%;font-size:1.1rem;display:grid;place-items:center;flex:none}
.qrimg{width:100%;max-width:360px;display:block;margin:0 auto;border-radius:14px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.88rem;z-index:60;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{background:none;border:0;color:var(--rice);font-weight:700}
.preview{background:var(--surface-2);border-radius:12px;padding:12px}
.preview .r{display:flex;justify-content:space-between;font-size:.88rem;padding:3px 0;gap:8px}
.preview .r.t{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:700}
.peritem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:center;margin-bottom:8px}
.peritem .who{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:.9rem}
.peritem .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peritem .val{font-size:.8rem;color:var(--muted);min-width:64px;text-align:right}
.fees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}.fees{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.setup{max-width:560px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.setup h2{font-size:1.6rem;font-weight:800}
.keyrow{display:flex;gap:8px}
.keyrow .inp{flex:1;min-width:0}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Trưa <i>Nay</i></h1><small id="todayLbl"></small></div>
    <div class="me" id="meChip" hidden></div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<div class="tabs"><nav id="tabbar" aria-label="Mục chính"></nav></div>

/* "45k+15k", "45.000", "45" (=45k), "12,5k" */
function money(expr){
  if(expr==null)return 0; if(typeof expr==="number")return expr;
  let t=String(expr).toLowerCase().replace(/đ|vnd|\s/g,""); if(!t)return 0;
  let total=0;
  for(const part of t.split("+")){
    if(!part)continue; let m=part.match(/^(\d+(?:[.,]\d+)?)k$/);
    if(m){total+=Math.round(parseFloat(m[1].replace(",","."))*1000);continue}
    const n=parseInt(part.replace(/[.,]/g,""),10); if(isNaN(n))continue;
    total+= n<1000? n*1000 : n;
  }
  return total;
}

/* ---------- VietQR ---------- */
const tlv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function qrNote(s){return unaccent(s).toUpperCase().replace(/[^A-Z0-9 ]/g,"").replace(/\s+/g," ").trim().slice(0,25)}
function vietqr(bin,acc,amount,note){
  const mai=tlv("00","A000000727")+tlv("01",tlv("00",bin)+tlv("01",acc))+tlv("02","QRIBFTTA");
  let p=tlv("00","01")+tlv("01",amount?"12":"11")+tlv("38",mai)+tlv("53","704");
  if(amount)p+=tlv("54",String(Math.round(amount)));
  p+=tlv("58","VN");
  if(note)p+=tlv("62",tlv("08",note));
  p+="6304";return p+crc16(p);
}
function drawQR(ctx,text,x,y,size,dark="#111"){
  const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount();const cell=size/(n+8);
  ctx.fillStyle="#fff";ctx.fillRect(x,y,size,size);ctx.fillStyle=dark;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(Math.floor(x+(c+4)*cell),Math.floor(y+(r+4)*cell),Math.ceil(cell),Math.ceil(cell));
}

const AI_MODELS=[["claude-haiku-4-5-20251001","Claude Haiku 4.5 (rẻ nhất)"],["claude-sonnet-5-5","Claude Sonnet 5.5"],["claude-opus-5-5","Claude Opus 5.5"]];
const WEB_MODEL="claude-sonnet-5-5";
const aiCfg=()=>Object.assign({key:"",model:AI_MODELS[0][0],web:true},recall("tn.ai",{}));
const aiReady=()=>!!aiCfg().key;
async function aiCall(prompt,{signal,web=false,maxTokens=1500}={}){
  const c=aiCfg();if(!c.key)throw{code:"no_key"};
  const model=web&&c.model===AI_MODELS[0][0]?WEB_MODEL:c.model;
  const body={model,max_tokens:maxTokens,messages:[{role:"user",content:prompt}]};
  if(web)body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:4,user_location:{type:"approximate",country:"VN",timezone:"Asia/Ho_Chi_Minh"}}];
  let r;
  try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)})}
  catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};throw{code:"network"}}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const t=(j.error&&j.error.type)||"",msg=(j.error&&j.error.message)||"";
    if(r.status===401)throw{code:"bad_key"};
    if(r.status===400&&/credit|balance|billing/i.test(msg))throw{code:"no_credit"};
    if(r.status===429)throw{code:"rate_limited"};
    if(r.status===529||t==="overloaded_error")throw{code:"overloaded"};
    throw{code:"api",message:msg}}
  return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
}
function parseJSON(t){
  try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
  const s=Math.min(...["{","["].map(c=>{const i=t.indexOf(c);return i<0?Infinity:i})),e=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(s<e){try{return JSON.parse(t.slice(s,e+1))}catch(err){}}
  throw{code:"invalid_json"};
}
async function aiJSON(prompt,opts){return parseJSON(await aiCall(prompt,opts))}

function spinPool(){
  const src=ui.spinSrc||(places().length?"places":"dishes");
  let pool=src==="places"?places():DISHES;
  if(ui.fTags.length)pool=pool.filter(p=>(p.tags||[]).some(t=>ui.fTags.includes(t)));
  if(src==="places"){
    if(ui.fPrice)pool=pool.filter(p=>+p.price===ui.fPrice);
    if(ui.fDist)pool=pool.filter(p=>p.dist===ui.fDist);
  }
  let excluded=0;
  if(src==="places"&&ui.avoid){const le=lastEaten(),ad=cfg().avoidDays;const keep=pool.filter(p=>daysAgo(le[p.id])>=ad);excluded=pool.length-keep.length;if(keep.length)pool=keep;else excluded=0}
  return {src,pool,excluded};
}

function weightedPick(pool,src){
  const le=lastEaten();
  const w=pool.map(p=>src==="places"?(daysAgo(le[p.id])>=14?2:1):1);
  let r=Math.random()*sum(w);for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i]}return pool[pool.length-1];
}
function doSpin(){
  const {src,pool}=spinPool();if(!pool.length)return;
  const win=weightedPick(pool,src);
  const el=$("#reelText"),meta=$("#reelMeta"),btn=$("#spinBtn");
  const finish=()=>{ui.spinning=false;ui.spinResult={src,id:win.id,name:win.name,tags:win.tags||[]};render()};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||pool.length<2){finish();return}
  ui.spinning=true;btn.disabled=true;el.className="";meta.textContent="Đang quay…";
  let step=0;const steps=22;
  const tick=()=>{
    if(step>=steps){finish();return}
    let n;do{n=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&n.name===el.textContent);
    el.textContent=step===steps-1?win.name:n.name;step++;
    setTimeout(tick,40+Math.pow(step/steps,2.4)*320);
  };tick();
}

/* --- suggest: history + AI --- */
function insights(){
  const out=[];const bs=billsSorted();const le=lastEaten();const ps=places();
  const last30=bs.filter(b=>daysAgo(b.date)<=30);
  if(last30.length){
    const cnt={};last30.forEach(b=>{const k=b.placeName||b.title;cnt[k]=(cnt[k]||0)+1});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3);
    out.push({k:top[0][1]+"×",t:`Hay ăn nhất 30 ngày qua: ${top.map(([n,c])=>n+" ("+c+")").join(", ")}.`});
    const tagCnt={};bs.filter(b=>daysAgo(b.date)<=7).forEach(b=>{const p=S.places.find(x=>x.id===b.placeId);(p?p.tags||[]:[]).forEach(t=>tagCnt[t]=(tagCnt[t]||0)+1)});
    const hot=Object.entries(tagCnt).sort((a,b)=>b[1]-a[1])[0];
    if(hot&&hot[1]>=2){const alt=Object.keys(TAGS).find(t=>t!==hot[0]&&!tagCnt[t]&&ps.some(p=>(p.tags||[]).includes(t)));
      out.push({k:hot[1]+"×",t:`Tuần này nhóm ăn ${TAGS[hot[0]]} ${hot[1]} lần.${alt?` Thử đổi sang ${TAGS[alt]}?`:""}`,tag:alt})}
  }
  const long=ps.filter(p=>le[p.id]&&daysAgo(le[p.id])>=14).sort((a,b)=>daysAgo(le[b.id])-daysAgo(le[a.id])).slice(0,3);
  if(long.length)out.push({k:"⟲",t:`Lâu rồi chưa quay lại: ${long.map(p=>p.name+" ("+daysAgo(le[p.id])+" ngày)").join(", ")}.`,places:long.map(p=>p.id)});
  const never=ps.filter(p=>!le[p.id]).slice(0,3);
  if(never.length)out.push({k:"Mới",t:`Có trong danh sách nhưng chưa ăn lần nào: ${never.map(p=>p.name).join(", ")}.`,places:never.map(p=>p.id)});
  const spend=last30.length?Math.round(sum(last30.map(b=>b.total))/sum(last30.map(b=>(b.shares||[]).length||1))):0;
  if(spend)out.push({k:fmtN(spend/1000)+"k",t:"Trung bình mỗi suất trong 30 ngày qua."});
  return out;
}

function calc(ed){
  const parts=ed.parts.filter(p=>person(p));const res={total:0,rows:[],err:""};
  if(!parts.length){res.err="Chọn ít nhất một người ăn.";return res}
  const raw={},sub={};let total=0;
  if(ed.mode==="equal"){total=money(ed.total);parts.forEach(p=>raw[p]=total/parts.length)}
  else if(ed.mode==="items"){let s=0;parts.forEach(p=>{sub[p]=money(ed.items[p]);s+=sub[p]});const adj=money(ed.ship)+money(ed.svc)-money(ed.disc);total=s+adj;parts.forEach(p=>raw[p]=s?sub[p]+adj*sub[p]/s:0);res.subtotal=s;res.adj=adj}
  else{parts.forEach(p=>{raw[p]=money(ed.items[p]);total+=raw[p]})}
  const payerIn=parts.includes(ed.payer);const others=parts.filter(p=>!(payerIn&&p===ed.payer));const amt={};
  const rnd=ed.round&&ed.mode!=="custom";
  others.forEach(p=>amt[p]=rnd?Math.ceil(raw[p]/1000-1e-9)*1000:Math.round(raw[p]));
  if(payerIn)amt[ed.payer]=Math.round(total)-sum(others.map(p=>amt[p]));
  else if(!rnd&&others.length){const d=Math.round(total)-sum(others.map(p=>amt[p]));if(d){const big=others.reduce((a,b)=>amt[b]>amt[a]?b:a);amt[big]+=d}}
  res.total=Math.round(total);res.rows=parts.map(p=>({pid:p,amount:amt[p],sub:sub[p]}));res.collected=sum(others.map(p=>amt[p]));
  if(res.total<=0)res.err=ed.mode==="equal"?"Nhập tổng tiền bill.":"Nhập tiền cho ít nhất một người.";
  return res;
}

async function markPaid(list,val){
  if(!canW())return;
  const byBill={};list.forEach(x=>(byBill[x.bill]=byBill[x.bill]||[]).push(x.pid));
  const undo=[];const now=new Date().toISOString();
  for(const [bid,pids] of Object.entries(byBill)){
    const b=S.bills.find(x=>x.id===bid);if(!b)continue;
    undo.push({bid,shares:b.shares.map(s=>({...s}))});
    await patch("bills",bid,{shares:b.shares.map(s=>pids.includes(s.pid)?{...s,paid:val,paidAt:val?now:null}:s)});
  }
  const amt=sum(list.map(x=>{const b=S.bills.find(y=>y.id===x.bill);const s=b&&b.shares.find(z=>z.pid===x.pid);return s?s.amount:0}));
  toast(val?`Đã ghi nhận ${pname(list[0].pid)} trả ${fmt(amt)}`:"Đã chuyển về chưa trả",async()=>{for(const u of undo)await patch("bills",u.bid,{shares:u.shares})});
}

function payInfo(pid){const p=person(pid);return p&&p.bank&&p.bank.bin&&p.bank.acc?p.bank:null}
async function fontsReady(){try{await document.fonts.load("700 40px 'Be Vietnam Pro'");await document.fonts.ready}catch(e){}}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrapText(ctx,t,max){const words=String(t).split(" ");const lines=[];let cur="";for(const w of words){const tt=cur?cur+" "+w:w;if(ctx.measureText(tt).width>max&&cur){lines.push(cur);cur=w}else cur=tt}if(cur)lines.push(cur);return lines}

async function groupCard(b){

    <div class="stack" style="margin-top:12px">

    </div>`;
  const sh=$("#qShare",el);if(sh)sh.onclick=async()=>{

function debtGroups(){
  const m=new Map();
  for(const b of S.bills)for(const s of b.shares||[]){
    if(s.paid||s.pid===b.payer||!(s.amount>0))continue;
    const k=s.pid+">"+b.payer;if(!m.has(k))m.set(k,{key:k,from:s.pid,to:b.payer,items:[]});m.get(k).items.push({bill:b,share:s});
  }
  return [...m.values()].map(g=>{g.items.sort((a,b)=>a.bill.date.localeCompare(b.bill.date));g.total=sum(g.items.map(i=>i.share.amount));g.oldest=g.items[0].bill.date;
    const rs=g.items.map(i=>i.share.remindedAt).filter(Boolean).sort();g.lastRemind=rs[rs.length-1]||null;g.remindCount=Math.max(0,...g.items.map(i=>i.share.remindCount||0));return g}).sort((a,b)=>b.total-a.total);
}
function needRemind(g){const c=cfg();return daysAgo(g.oldest)>=c.remindAfter&&(!g.lastRemind||sinceDays(g.lastRemind)>=c.remindEvery)}
async function recordRemind(g){
  if(!S.canWrite)return;const now=new Date().toISOString();
  const byBill={};g.items.forEach(i=>(byBill[i.bill.id]=byBill[i.bill.id]||[]).push(i.share.pid));
  for(const [bid,pids] of Object.entries(byBill)){const b=S.bills.find(x=>x.id===bid);if(!b)continue;
    await patch("bills",bid,{shares:b.shares.map(s=>pids.includes(s.pid)&&!s.paid?{...s,remindedAt:now,remindCount:(s.remindCount||0)+1}:s)})}
}
function viewDebts(){
  const gs=debtGroups();const mp=meP();const c=cfg();
  let h=`<div class="sec" style="margin-top:6px"><h2>Công nợ</h2><small>Nhắc sau ${c.remindAfter} ngày, rồi mỗi ${c.remindEvery} ngày</small></div>`;
  h+=`<div class="seg"><button data-dv="open" aria-pressed="${ui.debtView==="open"}">Chưa trả</button><button data-dv="paid" aria-pressed="${ui.debtView==="paid"}">Đã trả gần đây</button></div>`;
  if(ui.debtView==="paid"){
    const rows=[];for(const b of S.bills)for(const s of b.shares||[])if(s.paid&&s.pid!==b.payer)rows.push({b,s});
    rows.sort((a,b)=>(b.s.paidAt||"").localeCompare(a.s.paidAt||""));
    if(!rows.length)return h+`<div class="empty" style="margin-top:16px"><b>Chưa ai trả khoản nào</b>Khi bấm Đã trả trên bill, khoản đó sẽ hiện ở đây.</div>`;
    return h+`<div class="card" style="margin-top:14px;padding-block:4px"><div class="list">${rows.slice(0,40).map(({b,s})=>`<div class="li">${avatar(pname(s.pid))}<div class="mid"><b>${esc(pname(s.pid))} → ${esc(pname(b.payer))}</b><small>${esc(b.placeName||b.title)} · ${esc(dLong(b.date))}${s.paidAt?" · trả "+esc(dLong(s.paidAt.slice(0,10)).toLowerCase()):""}</small></div><div class="end"><b class="num">${fmt(s.amount)}</b><button class="btn sm ghost" data-unpay="${b.id}|${s.pid}">Hoàn tác</button></div></div>`).join("")}</div></div>`;
  }
  if(mp){const owe=sum(gs.filter(g=>g.from===mp.id).map(g=>g.total)),get=sum(gs.filter(g=>g.to===mp.id).map(g=>g.total));
    h+=`<div class="sumbar" style="margin-top:14px"><div><span class="eyebrow">Bạn được nợ</span><b class="num" style="color:var(--ok)">${fmt(get)}</b></div><div><span class="eyebrow">Bạn đang nợ</span><b class="num" style="color:${owe?"var(--warn)":"var(--ink)"}">${fmt(owe)}</b></div></div>`}
  if(!gs.length)return h+`<div class="empty" style="margin-top:16px"><b>Không ai nợ tiền cơm</b>Khi tạo bill, phần chưa trả của từng người sẽ hiện ở đây để nhắc.</div>`;
  if(!mp)h+=`<div style="margin-top:14px"></div>`;
  h+=`<p class="muted small" style="margin:14px 0 8px">Tổng đang chờ thu <b class="num" style="color:var(--ink)">${fmt(sum(gs.map(g=>g.total)))}</b> · ${gs.filter(needRemind).length} khoản cần nhắc</p>`;
  for(const g of gs){

    <p class="err" id="ppErr" hidden></p>
    <button class="btn primary block" id="ppSave">Lưu</button>
    <div class="grid2">${p.id===S.meId?`<span></span>`:`<button class="btn" id="ppClaim">Đây là tôi</button>`}<button class="btn danger" id="ppDel">${ui.confirm==="pp"+id?"Bấm lần nữa":"Xóa khỏi nhóm"}</button></div></div>`);
  const read=()=>{const bin=$("#ppBank",el).value,acc=$("#ppAcc",el).value.replace(/\D/g,""),holder=unaccent($("#ppHolder",el).value).toUpperCase().replace(/[^A-Z ]/g,"").trim();return{bin,acc,holder}};
  $("#ppTest",el).onclick=()=>{const b=read();const box=$("#ppQR",el);if(!b.bin||!b.acc){box.innerHTML=`<p class="err">Chọn ngân hàng và nhập số tài khoản.</p>`;return}
    const c=document.createElement("canvas");c.width=c.height=300;drawQR(c.getContext("2d"),vietqr(b.bin,b.acc,0,"TEST TRUA NAY"),0,0,300);box.innerHTML=`<img class="qrimg" style="max-width:220px" alt="QR thử" src="${c.toDataURL()}">`};
  $("#ppSave",el).onclick=async()=>{const name=$("#ppName",el).value.trim();const b=read();const e=$("#ppErr",el);
    if(!name){e.textContent="Nhập tên.";e.hidden=false;return}
    if((b.bin||b.acc)&&!(b.bin&&b.acc.length>=6)){e.textContent="Chọn ngân hàng và nhập đủ số tài khoản, hoặc để trống cả hai.";e.hidden=false;return}
    if(await patch("people",id,{name,phone:$("#ppPhone",el).value.replace(/[^\d]/g,""),bank:b.bin&&b.acc?b:null})){closeSheet();toast("Đã lưu "+name)}};
  const cl=$("#ppClaim",el);if(cl)cl.onclick=()=>{setMe(id);closeSheet();toast("Xin chào "+p.name)};
  $("#ppDel",el).onclick=async()=>{if(ui.confirm!=="pp"+id){ui.confirm="pp"+id;$("#ppDel",el).textContent="Bấm lần nữa";return}ui.confirm=null;
    if(await patch("people",id,{archived:true})){if(S.meId===id)setMe(null);closeSheet();toast("Đã xóa "+p.name+" khỏi nhóm (bill cũ vẫn giữ)",()=>patch("people",id,{archived:false}))}};
}

boot();
</script>
</body>
</html>
