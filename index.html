<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trưa Nay</title>
<meta name="description" content="Chọn quán ăn trưa, chia bill với bạn bè, gửi QR chuyển khoản qua Zalo.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trưa Nay">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">

<script>(function(){var t="pastel";try{t=JSON.parse(localStorage.getItem("tn2.theme"))||"pastel"}catch(e){}document.documentElement.setAttribute("data-theme",t);var c={pastel:"#F6F4FB",light:"#F7F7F8",dark:"#121214"}[t]||"#F6F4FB";document.write('<meta name="theme-color" content="'+c+'">')})();</script>
<style>
/* Pastel, compact: lavender-mist ground, mint as the action colour, peach for the one playful moment (spin) */
:root{
  --bg:#F6F4FB; --surface:#FFFFFF; --surface-2:#F0EEF7; --ink:#2F2C3B; --muted:#8C88A1; --line:#E8E5F1;
  --mint:#7FCBA8; --mint-ink:#173A2B; --mint-soft:#E2F4EB;
  --peach:#F4B49C; --peach-ink:#4A2418; --peach-soft:#FDEAE2;
  --sky-soft:#E5EEFB; --sky-ink:#2D4A75; --butter-soft:#FBF2D6; --butter-ink:#6B5414; --lilac-soft:#EEE8FB;
  --ok:#3C9A6E; --warn:#CC7A47; --danger:#CF5B5B;
  --shadow:0 1px 2px rgba(47,44,59,.05),0 6px 18px -10px rgba(47,44,59,.18);
  --f-head:"Nunito","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; color-scheme:light;
}
/* Sáng: neutral white */
:root[data-theme="light"]{
  --bg:#F7F7F8; --surface:#FFFFFF; --surface-2:#EFEFF2; --ink:#1C1C1E; --muted:#6E6E76; --line:#E4E4E9;
  --mint:#2E9E68; --mint-ink:#FFFFFF; --mint-soft:#E3F3EA; --peach:#EE8456; --peach-ink:#FFFFFF; --peach-soft:#FCEAE1;
  --sky-soft:#E6EEFA; --sky-ink:#2A4F86; --butter-soft:#FBF1D3; --butter-ink:#6B5414; --lilac-soft:#F0F0F4;
  --ok:#2E8A5C; --warn:#C8682F; --danger:#D23F3F; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px -10px rgba(0,0,0,.18); color-scheme:light}
/* Tối: neutral dark */
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1C1C20; --surface-2:#27272C; --ink:#F2F2F5; --muted:#9B9BA4; --line:#2F2F35;
  --mint:#4CC38A; --mint-ink:#0B1F14; --mint-soft:#17301F; --peach:#F2875C; --peach-ink:#26100A; --peach-soft:#3A2219;
  --sky-soft:#1C2A40; --sky-ink:#A9C4F5; --butter-soft:#3A3218; --butter-ink:#F0D78A; --lilac-soft:#232229;
  --ok:#6FD3A0; --warn:#F2A06F; --danger:#F08B8B; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding-inline:14px;padding-block:0 calc(76px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]{display:none!important}
.wrap{max-width:540px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:-.005em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.8rem}

/* header: solid, sticky, clears the status bar */
.top{position:sticky;top:0;z-index:15;background:var(--bg);margin-inline:-14px;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:1.45rem;font-weight:900}
.top small{display:block;color:var(--muted);font-size:.76rem;font-weight:500}
.top .act{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.mint{background:var(--mint);color:var(--mint-ink)}

/* basics */
.card{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
.between{justify-content:space-between}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px}
.sec h2{font-size:.95rem;font-weight:800}
.sec small{color:var(--muted);font-size:.76rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:10px;border:0;background:var(--surface-2);padding:7px 12px;font-weight:600;font-size:.84rem;min-height:34px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.mint{background:var(--mint);color:var(--mint-ink)}
.btn.peach{background:var(--peach);color:var(--peach-ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:28px;padding:4px 9px;font-size:.78rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;min-height:36px;font-size:16px}
textarea.inp{resize:vertical;min-height:60px}
.inp:focus{border-color:var(--mint);outline:none;box-shadow:0 0 0 3px var(--mint-soft)}
.lbl{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin:0 0 4px 2px}
.field{display:flex;flex-direction:column}
.hint{font-size:.75rem;color:var(--muted);margin:4px 2px 0}
.err{color:var(--danger);font-size:.8rem;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:0;background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:500;min-height:28px;display:inline-flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{background:var(--mint);color:var(--mint-ink)}
.chip .av{width:18px;height:18px;font-size:.55rem}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:5px 4px;font-size:.8rem;font-weight:600;color:var(--muted);min-height:30px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch input{width:40px;height:24px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;flex:none;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--mint)}
.switch input:checked::after{transform:translateX(16px)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:1px 8px;font-size:.7rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--mint-soft);color:var(--ok)}
.b-warn{background:var(--peach-soft);color:var(--warn)}
.b-soft{background:var(--surface-2);color:var(--muted)}
.b-sky{background:var(--sky-soft);color:var(--sky-ink)}
.b-butter{background:var(--butter-soft);color:var(--butter-ink)}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:.7rem;flex:none;overflow:hidden}
.empty{text-align:center;padding:22px 14px;color:var(--muted);font-size:.84rem}
.empty b{display:block;color:var(--ink);font-family:var(--f-head);font-size:1rem;margin-bottom:2px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none}
.li:last-child{border-bottom:0}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mid small{display:block;color:var(--muted);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.li .end b{font-family:var(--f-head);font-weight:800}
.chev{color:var(--muted);flex:none}
.pos{color:var(--ok)}.neg{color:var(--warn)}

/* eat */
.hello{background:var(--lilac-soft);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hello h2{font-size:1.2rem;font-weight:900}
.hello p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.ticket{background:var(--surface);border-radius:16px;padding:16px 14px 14px;text-align:center;box-shadow:var(--shadow);position:relative}
.reel{min-height:74px;display:grid;place-items:center;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:12px}
.reel b{font-family:var(--f-head);font-size:clamp(1.35rem,6vw,1.8rem);font-weight:900;line-height:1.15}
.reel b.idle{color:var(--muted);font-size:1.05rem;font-weight:800}
.reel b.won{color:var(--warn)}
.reel small{display:block;color:var(--muted);margin-top:4px;font-size:.76rem}
.spin{width:100%;border:0;border-radius:12px;background:var(--peach);color:var(--peach-ink);font-family:var(--f-head);font-weight:900;font-size:1.05rem;padding:10px;min-height:44px;box-shadow:0 4px 0 color-mix(in srgb,var(--peach) 70%,#000 12%);transition:transform .08s,box-shadow .08s}
.spin:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--peach) 70%,#000 12%)}
.spin[disabled]{opacity:.5}
.pick{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.pick b{font-family:var(--f-head);font-weight:800}
.pick p{margin:2px 0 8px;font-size:.8rem;color:var(--muted)}
.thinking{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;padding:8px 2px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--mint);animation:bob 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{opacity:.25}50%{opacity:1}}

/* bills */
.bill{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow)}
.bill .dt{width:38px;flex:none;text-align:center;line-height:1.05;border-radius:10px;background:var(--surface-2);padding:5px 0}
.bill .dt b{display:block;font-family:var(--f-head);font-size:1rem;font-weight:900}
.bill .dt small{font-size:.62rem;color:var(--muted);text-transform:uppercase}
.bill .mid{flex:1;min-width:0}
.bill .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill .mid small{display:block;color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.bill .end b{font-family:var(--f-head);font-weight:800}
.swipe{position:relative;margin-bottom:6px}
.swipe .bill{margin:0;transition:transform .2s ease;will-change:transform}
.swipe-act{position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:stretch}
.swipe-del{border:0;background:var(--peach-soft);color:var(--danger);font-weight:700;font-size:.8rem;width:84px;border-radius:var(--r);opacity:0;transition:opacity .15s}
.swipe.open .swipe-del,.swipe-del:focus{opacity:1}
.swipe-del.sure{background:var(--danger);color:#fff}
.swipe-del.sure{font-size:.7rem;padding:0 6px}
.month{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px}
.share{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.share:last-child{border-bottom:0}
.share .mid{flex:1;min-width:0}
.share .mid b{display:block;font-weight:600;font-size:.9rem}
.share .mid small{color:var(--muted);font-size:.72rem}
.share .amt{font-family:var(--f-head);font-weight:800;text-align:right}
.share .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;width:100%;padding-left:38px;margin-top:4px}
.share-wrap{display:flex;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.share-wrap:last-child{border-bottom:0}
.share-wrap .share{border:0;padding:0;width:100%}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;margin-top:4px;border-top:2px solid var(--surface-2)}
.total b{font-family:var(--f-head);font-size:1.3rem;font-weight:900}
.preview{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.preview .r{display:flex;justify-content:space-between;font-size:.82rem;padding:2px 0;gap:8px}
.preview .r.t{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;font-weight:700}
.peritem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:6px;align-items:center;margin-bottom:6px}
.peritem .who{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600;font-size:.84rem}
.peritem .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peritem .val{font-size:.74rem;color:var(--muted);min-width:56px;text-align:right}
.fees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fees4{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}

/* debts */
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum2 > div{border-radius:12px;padding:10px 12px}
.sum2 .in{background:var(--mint-soft)}.sum2 .out{background:var(--peach-soft)}
.sum2 small{display:block;font-size:.72rem;color:var(--muted);font-weight:600}
.sum2 b{font-family:var(--f-head);font-size:1.25rem;font-weight:900}
.pair{background:var(--surface);border-radius:var(--r);padding:10px 12px;margin-bottom:6px;box-shadow:var(--shadow)}
.pair .head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left}
.pair .who{flex:1;min-width:0}
.pair .who b{display:block;font-weight:600}
.pair .who small{color:var(--muted);font-size:.74rem}
.pair .amt{font-family:var(--f-head);font-size:1.05rem;font-weight:900;text-align:right}
.pair .sub{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.pair .sub .r{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.8rem;padding:3px 0}
.pair .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

/* poll */
.opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-radius:10px;background:var(--surface-2);padding:9px 10px;position:relative;overflow:hidden;margin-bottom:5px}
.opt .bar{position:absolute;inset:0 auto 0 0;background:var(--mint-soft);transition:width .3s}
.opt > *:not(.bar){position:relative}
.opt .mid{flex:1;min-width:0;font-weight:600}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--mint)}
.opt.win{box-shadow:inset 0 0 0 2px var(--peach)}

/* settings */
.set{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:0 12px}
.set .li{padding:11px 0}
.set .li .mid b{font-weight:500}
.ver{text-align:center;color:var(--muted);font-size:.74rem;margin:20px 0 6px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs nav{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;font-size:.66rem;font-weight:600;color:var(--muted);border-radius:10px;position:relative;min-height:46px}
.tabs button svg{width:21px;height:21px}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--mint-soft)}
.tabs .cnt{position:absolute;top:2px;right:calc(50% - 20px);background:var(--peach);color:var(--peach-ink);border-radius:999px;font-size:.58rem;min-width:15px;height:15px;padding:0 4px;display:grid;place-items:center;font-weight:700}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheet & toast */
.scrim{position:fixed;inset:0;background:rgba(30,28,40,.38);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;display:flex;flex-direction:column;overflow:hidden;border-radius:18px 18px 0 0;animation:up .2s ease-out}
.sheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.has-foot .sheet-b{padding-bottom:14px}
.sheet-f{flex:none;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -6px 14px -10px rgba(47,44,59,.25);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-f:empty{display:none}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet-h{flex:none;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 10px}
.sheet-h h3{font-size:1.05rem;font-weight:900}
.x{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted)}
.sheet-foot{display:flex;flex-direction:column;gap:6px}
.qrimg{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;width:100%;max-width:300px;display:block;margin:0 auto;border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(66px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.84rem;line-height:1.4;z-index:60;display:flex;gap:12px;align-items:center;justify-content:space-between;width:calc(100% - 28px);max-width:512px;box-shadow:var(--shadow)}
.toast span{flex:1;min-width:0}
body.sheet-open .toast{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
.toast button{flex:none;white-space:nowrap}
.toast button{background:none;border:0;color:var(--peach);font-weight:700}
.onb{max-width:420px;margin:10vh auto 0;display:flex;flex-direction:column;gap:12px}
.onb h2{font-size:1.5rem;font-weight:900}
.keyrow{display:flex;gap:6px}.keyrow .inp{flex:1;min-width:0}
/* receipt lines */
.ln{background:var(--surface-2);border-radius:10px;padding:6px}
.ln-top{display:grid;grid-template-columns:minmax(0,1fr) 86px 30px;gap:5px;align-items:center;margin-bottom:5px}
.ln .inp{min-height:32px;padding:4px 8px;background:var(--surface)}
.chip.mini{min-height:24px;padding:2px 9px;font-size:.74rem;background:var(--surface)}
.chip.mini[aria-pressed="true"]{background:var(--mint);color:var(--mint-ink)}
.loc{display:flex;align-items:center;gap:4px;min-width:0}.loc svg{width:14px;height:14px;flex:none}.loc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.su-dots{display:flex;align-items:center;gap:5px}
.su-dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.su-dots i.on{background:var(--mint)}.su-dots i.done{background:var(--mint-soft)}
.su-dots span{margin-left:auto}
/* guide: mock UI built from the app's own tokens */
.gd{padding:0}
.gd summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 12px;font-family:var(--f-head);font-weight:800;cursor:pointer}
.gd summary::-webkit-details-marker{display:none}
.gd summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.gd[open] summary::after{transform:rotate(-135deg)}
.gnum{width:22px;height:22px;border-radius:50%;background:var(--mint-soft);color:var(--ok);display:grid;place-items:center;font-size:.72rem;flex:none}
.gbody{padding:0 12px 12px}
.gbody p{margin:8px 2px 0;font-size:.82rem;line-height:1.5}
.gx{background:var(--lilac-soft);border-radius:12px;padding:12px;display:flex;justify-content:center;overflow-x:auto}
.mscr{background:var(--surface);border-radius:10px;padding:8px;box-shadow:var(--shadow);font-size:.72rem;display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;max-width:260px}
.mscr.mc{align-items:center;justify-content:center;flex:none;gap:3px}
.mscr small{font-size:.62rem;color:var(--muted)}
.mcap{font-size:.62rem;color:var(--muted);font-weight:600}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mrow > span{display:flex;align-items:center;gap:5px}
.mline{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mb{display:inline-flex;align-items:center;gap:3px;background:var(--surface-2);border-radius:999px;padding:3px 8px;font-size:.66rem;font-weight:600;white-space:nowrap}
.mb svg{width:11px;height:11px}
.mb.on,.mb.mint{background:var(--mint);color:var(--mint-ink)}
.hl{box-shadow:0 0 0 2px var(--peach);animation:pulse 1.6s ease-in-out infinite}
.mspin.hl{box-shadow:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--peach)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--peach) 40%,transparent)}}
.minp{border:1px solid var(--line);border-radius:7px;padding:4px 7px;color:var(--muted)}
.mseg{display:flex;background:var(--surface-2);border-radius:7px;padding:2px;gap:2px}
.mseg span{flex:1;text-align:center;padding:3px 2px;border-radius:5px;font-size:.6rem;color:var(--muted);font-weight:600}
.mseg span.on{background:var(--surface);color:var(--ink)}
.mprev{background:var(--surface-2);border-radius:7px;padding:5px 7px}
.mflow{display:flex;align-items:center;gap:4px;width:100%;justify-content:center}
.mflow.two{align-items:stretch;gap:8px}
.marr{color:var(--muted);flex:none}.marr svg{width:14px;height:14px}
.mzalo{background:var(--sky-soft)}
.mbub{background:var(--surface);border-radius:8px;padding:5px 7px;font-size:.62rem;line-height:1.3}
.mqr{display:grid;place-items:center;background:var(--surface-2);border-radius:8px;padding:6px}.mqr svg{width:34px;height:34px}
.mbadge{border-radius:999px;padding:1px 6px;font-size:.6rem;font-weight:600;background:var(--surface-2);color:var(--muted)}
.mbadge.warn{background:var(--peach-soft);color:var(--warn)}.mbadge.sky{background:var(--sky-soft);color:var(--sky-ink)}
.msum{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.msum span{border-radius:7px;padding:4px 6px;font-size:.6rem;color:var(--muted)}
.msum b{font-family:var(--f-head);color:var(--ink);font-size:.8rem}
.msum .in{background:var(--mint-soft)}.msum .out{background:var(--peach-soft)}
.mreel{text-align:center;font-family:var(--f-head);font-weight:900;color:var(--warn);font-size:.95rem;padding:8px 0;border-bottom:2px dashed var(--line)}
.mspin{text-align:center;background:var(--peach);color:var(--peach-ink);border-radius:8px;padding:5px;font-weight:800;font-family:var(--f-head)}
.mico{width:34px;height:34px;border-radius:9px}
.av.sm{width:16px;height:16px;font-size:.48rem}
@media (max-width:360px){.grid2,.sum2{grid-template-columns:1fr}.fees{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function money(expr){
  if(expr==null)return 0; if(typeof expr==="number")return expr;
  let t=String(expr).toLowerCase().replace(/đ|vnd|\s/g,""); if(!t)return 0;
  let total=0;
  for(const part of t.split("+")){
    if(!part)continue; const m=part.match(/^(\d+(?:[.,]\d+)?)k$/);
    if(m){total+=Math.round(parseFloat(m[1].replace(",","."))*1000);continue}
    const n=parseInt(part.replace(/[.,]/g,""),10); if(isNaN(n))continue;
    total+= n<1000? n*1000 : n;
  }
  return total;
}

/* ---------- VietQR ---------- */
const tlv=(id,v)=>id+String(v.length).padStart(2,"0")+v;
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function qrNote(s){return unaccent(s).toUpperCase().replace(/[^A-Z0-9 ]/g,"").replace(/\s+/g," ").trim().slice(0,25)}
function vietqr(bin,acc,amount,note){
  const mai=tlv("00","A000000727")+tlv("01",tlv("00",bin)+tlv("01",acc))+tlv("02","QRIBFTTA");
  let p=tlv("00","01")+tlv("01",amount?"12":"11")+tlv("38",mai)+tlv("53","704");
  if(amount)p+=tlv("54",String(Math.round(amount)));
  p+=tlv("58","VN");if(note)p+=tlv("62",tlv("08",note));
  p+="6304";return p+crc16(p);
}
function drawQR(ctx,text,x,y,size,dark="#2F2C3B"){
  const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount();const cell=size/(n+8);
  ctx.fillStyle="#fff";ctx.fillRect(x,y,size,size);ctx.fillStyle=dark;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(Math.floor(x+(c+4)*cell),Math.floor(y+(r+4)*cell),Math.ceil(cell),Math.ceil(cell));
}

let toastT=0;
function toast(msg,undo,label="Hoàn tác",ms){
  clearTimeout(toastT);const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status"><span></span>${undo?`<button>${esc(label)}</button>`:""}</div>`;
  r.querySelector("span").textContent=msg;if(undo)r.querySelector("button").onclick=()=>{r.innerHTML="";undo()};
  toastT=setTimeout(()=>r.innerHTML="",ms||(undo?6000:2800));
}
let sheetRefresh=null,sheetClose=null;
function openSheet(title,html,refresh,onClose){
  if(sheetClose){const f=sheetClose;sheetClose=null;f()}
  const root=$("#sheetRoot");
  root.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h3>${esc(title)}</h3><button class="x" aria-label="Đóng">✕</button></div><div class="sheet-b">${html}</div><div class="sheet-f"></div></div></div>`;
  const sc=root.firstChild;sc.onclick=e=>{if(e.target===sc)closeSheet()};$(".x",root).onclick=closeSheet;
  sheetRefresh=refresh||null;sheetClose=onClose||null;document.body.style.overflow="hidden";document.body.classList.add("sheet-open");
  // the action bar (.sheet-foot) lives outside the scroll area so it never moves, even with iOS bounce
  const body=$(".sheet-b",root),foot=$(".sheet-f",root),sheet=$(".sheet",root);
  const lift=()=>{const f=body.querySelector(".sheet-foot");if(f){foot.replaceChildren(f);sheet.classList.add("has-foot")}else if(!body.isConnected)return};
  new MutationObserver(()=>queueMicrotask(lift)).observe(body,{childList:true,subtree:true});queueMicrotask(lift);
  return body;
}

const FB=window.FIREBASE_CONFIG||null;

const D=(...p)=>doc(fs,...p), C=(...p)=>collection(fs,...p);
function onWriteErr(e){
  const c=e&&e.code;
  if(c==="permission-denied"){toast("Firebase từ chối ghi. Kiểm tra lại Rules theo hướng dẫn mới.");return}
  if(c==="resource-exhausted"){toast("Đã hết hạn mức miễn phí hôm nay của Firebase, mai dùng lại được.");return}
  toast("Chưa lưu được, kiểm tra mạng rồi thử lại.");
}
const W=p=>p.catch(onWriteErr);
const saveCard=d=>W(setDoc(D("profiles",myPid()),{...d,updatedAt:new Date().toISOString()},{merge:true}));
const savePriv=d=>W(setDoc(D("profiles",myPid(),"private","settings"),d,{merge:true}));

const strip=o=>{const c={...o};delete c.id;delete c._ext;return c};
function membersOf(b){return [...new Set((b.people||[]).map(p=>p.pid).filter(Boolean).concat(b.ownerPid?[b.ownerPid]:[]))]}
function saveBill(b,prevMembers){
  const data=strip(b);data.members=membersOf(b);data.updatedAt=new Date().toISOString();
  const bt=writeBatch(fs);
  bt.set(D("bills",b.id),data);
  data.members.forEach(m=>bt.set(D("profiles",m,"bills",b.id),data));
  (prevMembers||[]).filter(m=>!data.members.includes(m)).forEach(m=>bt.delete(D("profiles",m,"bills",b.id)));
  const i=S.bills.findIndex(x=>x.id===b.id);if(data.members.includes(myPid())){const v={id:b.id,...data};i<0?S.bills.push(v):S.bills[i]=v}
  schedule();
  return bt.commit().then(()=>true).catch(e=>{onWriteErr(e);return false});
}
function deleteBill(b){
  const bt=writeBatch(fs);bt.delete(D("bills",b.id));membersOf(b).forEach(m=>bt.delete(D("profiles",m,"bills",b.id)));
  S.bills=S.bills.filter(x=>x.id!==b.id);schedule();
  return bt.commit().then(()=>true).catch(e=>{onWriteErr(e);return false});
}

async function boot(){
  if(/[?&]v=/.test(location.search))history.replaceState(null,"",location.pathname+location.hash);
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  renderLoading("Đang kết nối…");
  if(!fbReady()){renderLoading("Chưa điền cấu hình Firebase trong config.js.");return}
  let app;
  try{app=initializeApp(FB);
    try{fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()}),ignoreUndefinedProperties:true})}
    catch(e){fs=initializeFirestore(app,{ignoreUndefinedProperties:true})}
  }catch(e){renderLoading("Cấu hình Firebase trong config.js chưa đúng.");return}
  const auth=getAuth(app);let started=false;
  onAuthStateChanged(auth,async u=>{
    if(!u||started)return;started=true;S.uid=u.uid;
    if(!S.me){renderOnboard();return}
    try{await setDoc(D("keys",S.me.pid),{secret:S.me.secret,uids:arrayUnion(S.uid)},{merge:true})}
    catch(e){if(e&&e.code==="permission-denied"){renderOnboard("Mã khôi phục trên máy này không còn đúng. Nhập lại mã hoặc tạo hồ sơ mới.");return}}
    startApp();
  });
  signInAnonymously(auth).catch(e=>renderLoading(e&&e.code==="auth/operation-not-allowed"?"Chưa bật đăng nhập Anonymous trong Firebase Authentication.":"Không kết nối được Firebase ("+((e&&e.code)||"mạng")+")."));
}

function spinPool(){
  const src=ui.spinSrc||(places().length?"places":"dishes");
  let pool=src==="places"?places():DISHES;
  if(ui.fTags.length)pool=pool.filter(p=>(p.tags||[]).some(t=>ui.fTags.includes(t)));
  if(src==="places"){if(ui.fPrice)pool=pool.filter(p=>+p.price===ui.fPrice);if(ui.fDist)pool=pool.filter(p=>p.dist===ui.fDist)}
  let excluded=0;
  if(src==="places"&&ui.avoid){const le=lastEaten(),ad=cfg().avoidDays;const keep=pool.filter(p=>daysAgo(placeLast(p,le))>=ad);excluded=pool.length-keep.length;if(keep.length)pool=keep;else excluded=0}
  return {src,pool,excluded};
}

function doSpin(){
  const {src,pool}=spinPool();if(!pool.length)return;
  const le=lastEaten();const likes=S.priv.likes||[];const w=pool.map(p=>(src==="places"&&daysAgo(placeLast(p,le))>=14?2:1)*((p.tags||[]).some(t=>likes.includes(t))?2:1));
  let r=Math.random()*sum(w),win=pool[pool.length-1];for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){win=pool[i];break}}
  const el=$("#reelText"),meta=$("#reelMeta"),btn=$("#spinBtn");
  const finish=()=>{ui.spinning=false;ui.spinResult={src,id:win.id,name:win.name,tags:win.tags||[]};render()};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||pool.length<2){finish();return}
  ui.spinning=true;btn.disabled=true;el.className="";meta.textContent="…";
  let step=0;const steps=20;
  const tick=()=>{if(step>=steps){finish();return}
    let n;do{n=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&n.name===el.textContent);
    el.textContent=step===steps-1?win.name:n.name;step++;setTimeout(tick,40+Math.pow(step/steps,2.4)*300)};tick();
}

function insights(){

  if(last30.length){const cnt={};last30.forEach(b=>{const k=b.placeName||b.title;cnt[k]=(cnt[k]||0)+1});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3);out.push("Hay ăn: "+top.map(([n,c])=>n+" ("+c+")").join(", "))}
  const long=ps.filter(p=>{const d=daysAgo(placeLast(p,le));return d>=14&&d!==Infinity}).slice(0,3);
  if(long.length)out.push("Lâu chưa quay lại: "+long.map(p=>p.name).join(", "));
  const never=ps.filter(p=>!placeLast(p,le)).slice(0,3);
  if(never.length)out.push("Chưa thử: "+never.map(p=>p.name).join(", "));
  return out;
}

- Ưu tiên loại món trong "so_thich"; tuyệt đối tránh món có thứ trong "khong_an_duoc"; nếu ăn lặp một loại món thì đổi loại khác.

Cuối cùng chỉ trả lời một JSON object:
{"note":"một câu ngắn","picks":[{"placeId":null,"name":"Tên quán","address":"Số nhà, phố, quận","dish":"Món nên gọi","price":"40-60k","distance":"khoảng 500m","confidence":"cao","why":"Lý do"${web?',"url":"link nguồn"':""}}]}`;
  try{const r=await aiJSON(prompt,{signal:ui.aiCtl.signal,web,maxTokens:web?3000:1200});if(!r||!Array.isArray(r.picks))throw{code:"invalid_json"};

/* --- AI transport: each person's own Anthropic key, only on this device --- */
const AI_MODELS=[["claude-haiku-4-5-20251001","Haiku 4.5 (rẻ nhất)"],["claude-sonnet-5-5","Sonnet 5.5"],["claude-opus-5-5","Opus 5.5"]];
const WEB_MODEL="claude-sonnet-5-5";
const aiCfg=()=>Object.assign({key:"",model:AI_MODELS[0][0],web:true},recall("tn2.ai",recall("tn.ai",{})));
const aiReady=()=>!!aiCfg().key;
async function aiCall(prompt,{signal,web=false,maxTokens=1200,images}={}){
  const c=aiCfg();if(!c.key)throw{code:"no_key"};
  const model=web&&c.model===AI_MODELS[0][0]?WEB_MODEL:c.model;
  const content=images&&images.length?[...images.map(im=>({type:"image",source:{type:"base64",media_type:im.media_type,data:im.data}})),{type:"text",text:prompt}]:prompt;
  const body={model,max_tokens:maxTokens,messages:[{role:"user",content}]};
  if(web)body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:4,user_location:{type:"approximate",country:"VN",timezone:"Asia/Ho_Chi_Minh"}}];
  let r;
  try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)})}
  catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};throw{code:"network"}}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const t=(j.error&&j.error.type)||"",msg=(j.error&&j.error.message)||"";
    if(r.status===401)throw{code:"bad_key"};if(r.status===400&&/credit|balance|billing/i.test(msg))throw{code:"no_credit"};
    if(r.status===429)throw{code:"rate_limited"};if(r.status===529||t==="overloaded_error")throw{code:"overloaded"};throw{code:"api",message:msg}}
  return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
}
function parseJSON(t){
  try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
  const s=Math.min(...["{","["].map(c=>{const i=t.indexOf(c);return i<0?Infinity:i})),e=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(s<e){try{return JSON.parse(t.slice(s,e+1))}catch(err){}}
  throw{code:"invalid_json"};
}
const aiJSON=async(p,o)=>parseJSON(await aiCall(p,o));
function aiErrText(e){
  const c=e&&e.code;
  return ({no_key:"Chưa có API key, nhập trong Cài đặt.",bad_key:"API key không đúng. Kiểm tra trong Cài đặt.",no_credit:"Tài khoản API hết tiền, nạp thêm ở console.anthropic.com.",rate_limited:"Hỏi nhiều quá, đợi một phút.",overloaded:"Claude đang quá tải, thử lại sau.",invalid_json:"AI trả lời sai định dạng, thử lại.",network:"Không gọi được API, kiểm tra mạng.",cancelled:""})[c]??("Lỗi khi gọi Claude"+(e&&e.message?": "+e.message:"."));
}

function myView(b){ // how a bill looks from my side
  const payer=P(b,b.payer);const iPay=isMe(payer);
  const others=(b.shares||[]).filter(s=>s.key!==b.payer);
  const due=sum(others.filter(s=>!settled(s)).map(s=>s.amount));
  const mineS=(b.shares||[]).find(s=>isMe(P(b,s.key)));
  return {payer,iPay,others,due,mine:mineS,paidN:others.filter(s=>settled(s)).length};
}
function viewBills(){
  let bs=billsSorted();
  if(ui.billFilter==="mine")bs=bs.filter(b=>myView(b).iPay);
  if(ui.billFilter==="open")bs=bs.filter(b=>{const v=myView(b);return v.iPay?v.due>0:(v.mine&&!settled(v.mine))});
  let h=`<div class="seg"><button data-bf="all" aria-pressed="${ui.billFilter==="all"}">Tất cả</button><button data-bf="mine" aria-pressed="${ui.billFilter==="mine"}">Tôi trả</button><button data-bf="open" aria-pressed="${ui.billFilter==="open"}">Chưa xong</button></div>`;
  if(!bs.length)return h+`<div class="empty" style="margin-top:14px"><b>${S.bills.length?"Không có bill nào ở đây":"Chưa có bill"}</b>${S.bills.length?"":"Bấm + để tạo bill sau bữa ăn."}</div>`;
  let cur="";
  for(const b of bs){
    const mk=b.date.slice(0,7);if(mk!==cur){cur=mk;const d=parseISO(b.date);h+=`<div class="month">Tháng ${d.getMonth()+1}/${d.getFullYear()}</div>`}
    const v=myView(b);const d=parseISO(b.date);
    let right,sub;
    if(v.iPay){right=`<b class="num">${fmtK(b.total)}</b>${v.due?`<span class="badge b-warn">Chờ ${fmtK(v.due)}</span>`:`<span class="badge b-ok">Đủ</span>`}`;sub=`Tôi trả · ${v.paidN}/${v.others.length} đã gửi`}
    else{right=`<b class="num">${v.mine?fmtK(v.mine.amount):"–"}</b>${v.mine?(v.mine.paid?`<span class="badge b-ok">Đã trả</span>`:v.mine.sentAt?`<span class="badge b-ok">Đã chuyển</span>`:`<span class="badge b-warn">Chưa trả</span>`):""}`;sub=`${esc(dn(v.payer,b))} trả · ${b.people.length} người`}
    const own=b.ownerPid===myPid();
    h+=`<div class="swipe" data-sw="${b.id}"><div class="swipe-act"><button class="swipe-del" data-del="${b.id}">${own?"Xóa":"Ẩn"}</button></div><button class="bill" data-bill="${b.id}"><span class="dt"><b>${d.getDate()}</b><small>${WD[d.getDay()]}</small></span><span class="mid"><b>${esc(b.placeName||b.title)}</b><small>${sub}</small></span><span class="end">${right}</span></button></div>`;
  }
  return h;
}

/* --- split maths --- */
const feeAdj=ed=>money(ed.ship)+money(ed.svc)+money(ed.vat)-money(ed.disc);
const f0=v=>v?fmtN(v):"";
function calc(ed){
  const parts=ed.sel.slice();const res={total:0,rows:[],err:""};
  if(!parts.length){res.err="Chọn người ăn.";return res}
  const raw={},sub={};let total=0;
  if(ed.mode==="equal"){total=money(ed.total);parts.forEach(p=>raw[p]=total/parts.length)}
  else if(ed.mode==="items"){let s=0;parts.forEach(p=>{sub[p]=money(ed.items[p]);s+=sub[p]});const adj=feeAdj(ed);total=s+adj;parts.forEach(p=>raw[p]=s?sub[p]+adj*sub[p]/s:0);res.subtotal=s;res.adj=adj}
  else if(ed.mode==="lines"){let s=0;parts.forEach(p=>sub[p]=0);
    (ed.lines||[]).forEach(l=>{const pr=money(l.price);if(!pr)return;const who=(l.who||[]).filter(k=>parts.includes(k));const tgt=who.length?who:parts;tgt.forEach(k=>sub[k]+=pr/tgt.length);s+=pr});
    const adj=feeAdj(ed);total=s+adj;parts.forEach(p=>raw[p]=s?sub[p]+adj*sub[p]/s:0);res.subtotal=s;res.adj=adj;
    res.unassigned=(ed.lines||[]).filter(l=>money(l.price)&&!(l.who||[]).some(k=>parts.includes(k))).length}
  else{parts.forEach(p=>{raw[p]=money(ed.items[p]);total+=raw[p]})}
  const payerIn=parts.includes(ed.payer);const others=parts.filter(p=>!(payerIn&&p===ed.payer));const amt={};
  const rnd=ed.round&&ed.mode!=="custom";
  others.forEach(p=>amt[p]=rnd?Math.ceil(raw[p]/1000-1e-9)*1000:Math.round(raw[p]));
  if(payerIn)amt[ed.payer]=Math.round(total)-sum(others.map(p=>amt[p]));
  else if(!rnd&&others.length){const d=Math.round(total)-sum(others.map(p=>amt[p]));if(d){const big=others.reduce((a,b)=>amt[b]>amt[a]?b:a);amt[big]+=d}}
  res.total=Math.round(total);res.rows=parts.map(p=>({key:p,amount:amt[p],sub:sub[p]}));
  if(res.total<=0)res.err=ed.mode==="equal"?"Nhập tổng tiền.":ed.mode==="lines"?"Thêm món hoặc quét ảnh bill.":"Nhập tiền cho ít nhất một người.";
  return res;
}
function freq(){const f={};for(const b of S.bills)for(const p of b.people||[]){const k=p.pid?"p_"+p.pid:p.cid?"c_"+p.cid:"";if(k)f[k]=(f[k]||0)+1}return f}
function candidates(b,extra=[]){

  add({key:"p_"+myPid(),name:myName(),pid:myPid(),cid:null,phone:S.card.phone||null});
  if(b)(b.people||[]).forEach(p=>add({...p}));
  extra.forEach(add);
  const f=freq();
  contacts().slice().sort((a,b2)=>(f[b2.pid?"p_"+b2.pid:"c_"+b2.id]||0)-(f[a.pid?"p_"+a.pid:"c_"+a.id]||0)).forEach(c=>add(c.pid?{key:"p_"+c.pid,name:c.name,pid:c.pid,cid:c.id,phone:c.phone||null}:{key:"c_"+c.id,name:c.name,pid:null,cid:c.id,phone:c.phone||null}));

}

/* --- free receipt reading: on-device OCR (tesseract.js) or pasted text --- */
function parseReceiptText(text){
  const out={place:"",date:null,items:[],ship:0,service:0,vat:0,discount:0,total:0};
  const priceRe=/(-?\s?\d{1,3}(?:[.,]\d{3})+|-?\d{4,7}|\d{1,4}(?:[.,]\d)?\s?k)\s*(?:đ|₫|vnđ|vnd|d)?\s*$/i;
  const toNum=s=>{s=s.replace(/\s/g,"").toLowerCase();const neg=s.startsWith("-");s=s.replace("-","");let n=/k$/.test(s)?Math.round(parseFloat(s.replace(",","."))*1000):parseInt(s.replace(/[.,]/g,""),10);return neg?-n:n};
  const lines=String(text||"").split(/\r?\n/).map(l=>l.replace(/[|_*•·]+/g," ").replace(/\s+/g," ").trim()).filter(Boolean);
  const finals=[],gross=[];let lastItemLine=-9;
  lines.forEach((raw,i)=>{
    const n=norm(raw);
    const dm=raw.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})/);if(dm&&!out.date){out.date=`${dm[3]}-${pad(+dm[2])}-${pad(+dm[1])}`}
    const pm=raw.match(priceRe);
    if(!pm){
      if(lastItemLine===i-1&&out.items.length&&!finals.length&&!gross.length&&/^[a-zà-ỹ][a-zà-ỹ\s,()\-]{1,40}$/i.test(raw)&&!/cam on|hen gap|wifi|dia chi|khach hang/.test(n)){const it=out.items[out.items.length-1];it.name=(it.name+" "+raw).slice(0,60);lastItemLine=i;return}
      if(!out.place&&i<3&&/[a-zà-ỹ]{2}/i.test(raw)&&!/hoa don|bill|receipt|dia chi|dt:|sdt|tel/.test(n))out.place=raw.slice(0,60);return}
    const val=toNum(pm[1]);if(!val||Math.abs(val)>50000000)return;
    const label=n.slice(0,n.length-norm(pm[0]).length);
    if(/tam tinh|subtotal|tien mat|tien thua|tien khach|khach dua|tra lai|change|cash|chuyen khoan|so luong|sl:|tien hang|duoc ap dung|ap dung km|diem|tich luy/.test(label))return;
    if(/phai tra|can thanh toan|tong thanh toan|thanh toan|can tra|tong cong|grand total/.test(label)){finals.push(Math.abs(val));return}
    if(/(^|\s)(tong|total)/.test(label)){gross.push(Math.abs(val));return}
    if(/giam|khuyen mai|voucher|uu dai|discount|chiet khau|ma km/.test(label)){out.discount+=Math.abs(val);return}
    if(/phi giao|van chuyen|ship|delivery|giao hang/.test(label)){out.ship+=Math.abs(val);return}
    if(/(^|[\s:])(vat|v4t|val|vai)([\s:(%]|$)|thue|gtgt|tax/.test(label+" ")){out.vat+=Math.abs(val);return}
    if(/phi|phu thu|service|dich vu|dong goi/.test(label)){out.service+=Math.abs(val);return}
    if(/ngay|gio|ban so|so hd|hoa don|ma don|order|dt|sdt|tel|wifi|ban:/.test(label))return;
    let name=raw.slice(0,raw.length-pm[0].length).trim();let qty=1;
    let q=name.match(/^(\d{1,2})\s*[x×*]?\s+(?=\D)/i)||name.match(/^[x×]\s?(\d{1,2})\s+/i);if(q){qty=+q[1];name=name.slice(q[0].length)}
    q=name.match(/\s[x×]\s?(\d{1,2})$/i);if(q){qty=+q[1];name=name.slice(0,q.index)}
    q=name.match(/\s(\d{1,2})(?:[.,]0{1,2})?\s+\d{1,3}(?:[.,]\d{3})+$/);if(q&&qty===1){qty=+q[1];name=name.slice(0,q.index)}
    q=name.match(/\s(\d{1,2})[.,]0{1,2}$/);if(q&&qty===1){qty=+q[1];name=name.slice(0,q.index)}
    name=name.replace(/(\s+[\d.,]+(?:\s?đ)?)+$/,"").replace(/^[\s:.\-–]+|[\s:.\-–]+$/g,"").trim();
    if(!/[a-zà-ỹ]{2}/i.test(name)||val<=0)return;
    out.items.push({name:name.slice(0,60),qty,price:val});lastItemLine=i;
  });
  out.total=finals.length?finals[finals.length-1]:gross.length?gross[gross.length-1]-out.discount+out.vat+out.service+out.ship:0;
  return out;
}
let ocrWorker=null;
function loadScript(src){return new Promise((ok,no)=>{if(window.Tesseract)return ok();const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no({code:"ocr_load"});document.head.appendChild(s)})}
async function ocrImage(file,onProgress){
  await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js");
  if(!ocrWorker)ocrWorker=await Tesseract.createWorker("vie",1,{logger:m=>{if(m.status==="recognizing text")onProgress&&onProgress(Math.round(m.progress*100))}});
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const k=Math.min(1,2000/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const x=c.getContext("2d");x.filter="grayscale(1) contrast(1.25)";x.drawImage(img,0,0,c.width,c.height);
    const {data}=await ocrWorker.recognize(c);return data.text||""}
  finally{URL.revokeObjectURL(url)}
}
async function shrinkImage(file,max=1568){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.85).split(",")[1]}
  finally{URL.revokeObjectURL(url)}
}
async function scanReceipt(file){
  const data=await shrinkImage(file);
  const prompt=`Ảnh này là hóa đơn hoặc ảnh chụp màn hình đơn hàng đồ ăn ở Việt Nam (quán, GrabFood, ShopeeFood, beFood...).
Đọc từng dòng món. "price" là THÀNH TIỀN của dòng (đã nhân số lượng), số nguyên đồng (vd 45.000 → 45000; 45k → 45000).
Nếu một dòng có số lượng > 1 thì vẫn giữ một dòng, ghi qty.
Không đưa phí giao, phí dịch vụ, thuế, giảm giá, tổng vào items; ghi riêng vào ship (phí giao), service (phí dịch vụ, phí áp dụng, phụ thu), vat (thuế VAT/GTGT), discount (tổng giảm giá, khuyến mãi, voucher; số dương), total (số tiền cuối cùng phải trả).
Không đọc được thì để 0 hoặc null. Không bịa món.
Chỉ trả lời một JSON object:
{"place":"Tên quán hoặc null","date":"YYYY-MM-DD hoặc null","items":[{"name":"Tên món","qty":1,"price":45000}],"ship":0,"service":0,"vat":0,"discount":0,"total":0}`;
  const r=await aiJSON(prompt,{images:[{media_type:"image/jpeg",data}],maxTokens:2000});
  const num=v=>Math.max(0,Math.round(+v||0));
  const items=(Array.isArray(r&&r.items)?r.items:[]).map(it=>({name:String(it.name||"").trim().slice(0,60),qty:num(it.qty)||1,price:num(it.price)})).filter(it=>it.name&&it.price>0);
  if(!items.length)throw{code:"no_items"};
  return {place:r.place?String(r.place).slice(0,60):"",date:r.date||null,items,ship:num(r.ship),service:num(r.service),vat:num(r.vat),discount:num(r.discount),total:num(r.total)};
}

function debtGroups(){

    for(const s of b.shares||[]){if(settled(s)||s.key===b.payer||!(s.amount>0))continue;const p=P(b,s.key);if(!p)continue;
      let dir,person;

      const id=idOf(person,b);const k=dir+"|"+id;

    }}
  return [...m.values()].map(g=>{g.items.sort((a,b)=>a.bill.date.localeCompare(b.bill.date));g.total=sum(g.items.map(i=>i.share.amount));g.oldest=g.items[0].bill.date;

/* ---------- import from the phone's contacts (Contact Picker on Android, .vcf file on iPhone) ---------- */
const canPickContacts=()=>"contacts" in navigator&&"ContactsManager" in window;
function normPhone(p){p=String(p||"").replace(/[^\d+]/g,"");if(p.startsWith("+84"))p="0"+p.slice(3);else if(p.startsWith("84")&&p.length===11)p="0"+p.slice(2);return p.replace(/\D/g,"")}
function parseVCF(text){
  const raw=String(text||"").replace(/\r\n/g,"\n").replace(/\n[ \t]/g,"").replace(/=\n/g,"");
  const qp=s=>{try{return decodeURIComponent(s.replace(/=([0-9A-F]{2})/gi,"%$1"))}catch(e){return s}};
  const out=[];
  for(const card of raw.split(/BEGIN:VCARD/i).slice(1)){
    let fn="",n="",tels=[];
    for(const line of card.split("\n")){
      const i=line.indexOf(":");if(i<0)continue;const key=line.slice(0,i).toUpperCase();let val=line.slice(i+1).trim();
      if(/QUOTED-PRINTABLE/.test(key))val=qp(val);
      val=val.replace(/\\([,;\\])/g,"$1");
      if(/^(ITEM\d+\.)?FN(;|$)/.test(key))fn=val;
      else if(/^(ITEM\d+\.)?N(;|$)/.test(key)){const p=val.split(";");n=[p[1],p[2],p[0]].filter(Boolean).join(" ").trim()}
      else if(/^(ITEM\d+\.)?TEL(;|$)/.test(key)){const t=normPhone(val);if(t)tels.push({t,mob:/CELL|IPHONE|MOBILE/.test(key)})}
    }
    const name=(fn||n).trim();const tel=(tels.find(x=>x.mob)||tels[0]||{}).t||"";
    if(name||tel)out.push({name:name||tel,phone:tel});
  }
  return out;
}
function startImport(){
  if(canPickContacts()){
    navigator.contacts.select(["name","tel"],{multiple:true}).then(list=>{previewImport(list.map(c=>({name:((c.name||[])[0]||"").trim(),phone:normPhone((c.tel||[])[0]||"")})).filter(c=>c.name||c.phone).map(c=>({name:c.name||c.phone,phone:c.phone})))}).catch(()=>{});
    return;
  }
  const el=openSheet("Nhập từ danh bạ điện thoại",`<div class="stack">
    <p class="small" style="margin:0">iPhone chưa cho trang web đọc thẳng danh bạ, nên mình dùng file danh bạ (.vcf):</p>
    <ol class="small" style="margin:0;padding-left:18px;line-height:1.6"><li>Mở app <b>Danh bạ</b>, giữ ngón tay lên một liên hệ, chọn <b>Chia sẻ liên hệ</b> → <b>Lưu vào Tệp</b>.<br><span class="muted">Nhiều người một lần: bấm <b>Danh sách</b> ở góc trái, giữ lên danh sách, chọn <b>Xuất</b>.</span></li><li>Quay lại đây, bấm <b>Chọn file danh bạ</b>.</li></ol>
    <input type="file" id="vcfFile" accept=".vcf,text/vcard,text/x-vcard" multiple hidden>
    <button class="btn mint block" id="vcfPick">${ic("contacts")} Chọn file danh bạ</button><p class="err" id="vcfErr" hidden></p></div>`);
  $("#vcfPick",el).onclick=()=>$("#vcfFile",el).click();
  $("#vcfFile",el).onchange=async e=>{const files=[...(e.target.files||[])];if(!files.length)return;let list=[];
    for(const f of files)list=list.concat(parseVCF(await f.text()));
    if(!list.length){const er=$("#vcfErr",el);er.textContent="Không đọc được liên hệ nào trong file này.";er.hidden=false;return}
    previewImport(list)};
}
function previewImport(list){
  const seen=new Set();list=list.filter(c=>{const k=c.phone||norm(c.name);if(seen.has(k))return false;seen.add(k);return true});
  const has=c=>S.contacts.some(x=>!x.hidden&&((c.phone&&normPhone(x.phone)===c.phone)||norm(x.name)===norm(c.name)));
  const rows=list.map(c=>({...c,dup:has(c),on:!has(c)}));let q="";
  const el=openSheet("Chọn người để thêm","");
  const draw=()=>{const vis=rows.filter(r=>!q||norm(r.name+" "+r.phone).includes(norm(q)));const n=rows.filter(r=>r.on).length;
    el.innerHTML=`<div class="stack">${rows.length>8?`<input class="inp" id="imQ" placeholder="Tìm" value="${esc(q)}" autocomplete="off">`:""}
      <div class="row between small"><span class="muted">${rows.length} liên hệ · đã chọn ${n}</span><button class="btn sm ghost" id="imAll">${n<rows.filter(r=>!r.dup).length?"Chọn tất cả":"Bỏ chọn"}</button></div>
      <div class="card" style="padding-block:0;max-height:52vh;overflow:auto"><div class="list">${vis.map(r=>{const i=rows.indexOf(r);return `<label class="li" style="cursor:pointer"><input type="checkbox" data-im="${i}" ${r.on?"checked":""} style="width:18px;height:18px;flex:none">${avatar(r.name)}<span class="mid"><b>${esc(r.name)}</b><small>${esc(r.phone||"Không có số")}${r.dup?" · đã có trong danh bạ":""}</small></span></label>`}).join("")}</div></div>
      <button class="btn mint block" id="imGo" ${n?"":"disabled"}>Thêm ${n} người</button></div>`;
    const qi=$("#imQ",el);if(qi){qi.oninput=()=>{q=qi.value;draw();const x=$("#imQ",el);x.focus();x.setSelectionRange(q.length,q.length)}}
    $$("[data-im]",el).forEach(c=>c.onchange=()=>{rows[+c.dataset.im].on=c.checked;draw()});
    $("#imAll",el).onclick=()=>{const all=rows.filter(r=>r.on).length<rows.filter(r=>!r.dup).length;rows.forEach(r=>r.on=all&&!r.dup);draw()};
    $("#imGo",el).onclick=async()=>{const pick=rows.filter(r=>r.on);const now=new Date().toISOString();
      for(let i=0;i<pick.length;i+=400){const bt=writeBatch(fs);pick.slice(i,i+400).forEach(r=>bt.set(D("profiles",myPid(),"contacts",rid()+i),{name:r.name.slice(0,40),phone:r.phone,bank:null,pid:null,hidden:false,createdAt:now}));await bt.commit().catch(onWriteErr)}
      closeSheet();toast("Đã thêm "+pick.length+" người vào danh bạ")};
  };
  draw();
}

/* ---------- update check: compares with version.json on GitHub Pages ---------- */
const upd={latest:null,notes:"",checking:false,at:null,shown:null};
function newer(a,b){const x=String(a).split(".").map(Number),y=String(b).split(".").map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false}
async function checkUpdate(manual){
  if(upd.checking)return;upd.checking=true;if(manual)render();
  try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});const j=await r.json();upd.latest=j.version;upd.notes=j.notes||"";const d=new Date();upd.at=pad(d.getHours())+":"+pad(d.getMinutes())}
  catch(e){if(manual)toast("Chưa kiểm tra được, thử lại khi có mạng.")}
  upd.checking=false;upd.last=Date.now();
  if(upd.latest&&newer(upd.latest,VERSION)){if(manual||upd.shown!==upd.latest){upd.shown=upd.latest;showUpdateBar()}}
  else if(manual&&upd.latest)toast("Bạn đang dùng bản mới nhất ("+VERSION+")");
  render();
}
function showUpdateBar(){
  const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status"><span>Có bản mới ${esc(upd.latest)}${upd.notes?": "+esc(upd.notes):""}</span><button id="updGo">Tải lại</button></div>`;
  clearTimeout(toastT);$("#updGo").onclick=applyUpdate;
}
async function applyUpdate(){
  toast("Đang cập nhật…");
  // drop the old service worker and caches, then load with a cache-busting URL so neither the worker nor the browser cache serves the old page
  try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(regs.map(g=>g.unregister().catch(()=>{})));
    if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}
  location.replace(location.pathname+"?v="+encodeURIComponent(upd.latest||Date.now())+location.hash);
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.mode==="db"&&(!upd.at||Date.now()-upd.last>30*60000)){upd.last=Date.now();checkUpdate()}});

/* ---------- links: #b= bill, #p= person, #v= poll ---------- */
let pendingHash=location.hash;
function handleHash(){
  const h=pendingHash||"";pendingHash="";if(!h)return;
  history.replaceState(null,"",location.pathname);
  let m;
  if((m=h.match(/#b=([a-z0-9]{16,40})/i)))openBillDetail(m[1]);
  else if((m=h.match(/#p=([a-z0-9]{16,40})(?:~(.*))?/i)))addFromLink(m[1],decodeURIComponent(m[2]||"Bạn mới"));
  else if((m=h.match(/#v=([a-z0-9]{16,40})/i))){ui.tab="eat";ui.eatView="vote";render();openPoll(m[1])}
}
window.addEventListener("hashchange",()=>{if(S.mode==="db"&&location.hash){pendingHash=location.hash;handleHash()}});

/* money inputs: thousand separators while typing (45000 -> 45.000), caret kept in place */
document.addEventListener("input",e=>{const i=e.target;if(!i||!i.matches||!i.matches("input[data-money]"))return;const v=i.value;if(!/^[\d.\s]*$/.test(v))return;
  const pos=i.selectionStart==null?v.length:i.selectionStart;const before=v.slice(0,pos).replace(/\D/g,"").length;
  const dg=v.replace(/\D/g,"").replace(/^0+(?=\d)/,"").slice(0,12);const f=dg?Number(dg).toLocaleString("vi-VN"):"";if(f===v)return;
  i.value=f;let n=0,p=0;while(p<f.length&&n<before){if(/\d/.test(f[p]))n++;p++}try{i.setSelectionRange(p,p)}catch(err){}},true);
/* buttons marked data-kf keep the keyboard open (no blur of the focused input) */
["mousedown","pointerdown"].forEach(t=>document.addEventListener(t,e=>{if(e.target.closest&&e.target.closest("[data-kf]")&&document.activeElement&&document.activeElement.matches("input,textarea"))e.preventDefault()},true));
/* no pinch / double-tap zoom (iOS Safari ignores user-scalable) */
["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});

boot();
